server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://101.42.50.179:5432/lab
    username: user
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

smartlab:
  adapter:
    heartbeat-timeout-seconds: ${SMARTLAB_ADAPTER_HEARTBEAT_TIMEOUT_SECONDS:30}
  state-machine:
    intrinsic-scan-interval-ms: ${SMARTLAB_INTRINSIC_SCAN_INTERVAL_MS:100}
  constraint:
    scan-interval-ms: ${SMARTLAB_CONSTRAINT_SCAN_INTERVAL_MS:200}
  workflow:
    poll-interval-ms: ${SMARTLAB_WORKFLOW_POLL_INTERVAL_MS:100}
    simulation-timeout-seconds: ${SMARTLAB_WORKFLOW_SIMULATION_TIMEOUT_SECONDS:60}
    core-pool-size: ${SMARTLAB_WORKFLOW_CORE_POOL_SIZE:4}
    max-pool-size: ${SMARTLAB_WORKFLOW_MAX_POOL_SIZE:8}
    queue-capacity: ${SMARTLAB_WORKFLOW_QUEUE_CAPACITY:200}
  virtual-lease:
    grant-timeout-seconds: ${SMARTLAB_VIRTUAL_LEASE_GRANT_TIMEOUT_SECONDS:15}
    poke-idle-timeout-seconds: ${SMARTLAB_VIRTUAL_LEASE_POKE_IDLE_TIMEOUT_SECONDS:3600}
    poke-expire-scan-ms: ${SMARTLAB_VIRTUAL_LEASE_POKE_EXPIRE_SCAN_MS:30000}
  agent:
    enabled: true
    provider: openai-compatible
    base-url: ${SMARTLAB_AGENT_BASE_URL:http://quantum.sxicc.ac.cn:8000/v1}
    api-key: ${SMARTLAB_AGENT_API_KEY:1}
    model: ${SMARTLAB_AGENT_MODEL:Qwen3.8-27B}
    max-rounds: 12
    validate-retries: 3
  auth:
    jwt-secret: ${SMARTLAB_JWT_SECRET:change_me_to_a_256_bit_secret_for_local_dev}
    expiration-ms: ${SMARTLAB_JWT_EXPIRATION_MS:86400000}

# MQTT Broker Config
mqtt:
  # broker: tcp://192.168.11.178:1883
  broker: tcp://127.0.0.1:1883
  client-id: smartlab_system
  username: lab_system
  password: 123456
  auto-start: true
  reconnect-delay-ms: 15000

logging:
  level:
    root: INFO
    com.smartlab: DEBUG
