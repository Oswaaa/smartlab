; SmartLab Adapter INI 配置规范
; 所有 description 均为系统契约数据，不能写成注释。
; 标识符（模板、命令、参数、属性、事件、设备点）不能包含 "."，
; 因为 "." 用于 section 的层级分隔。
; 属性/参数值格式：[数据类型][描述][可选修饰符]...
; 支持数据类型：DOUBLE、INTEGER、BOOLEAN、STRING。
; 描述中若需使用 "]"，请写为 "\]"；反斜杠写为 "\\"。

[adapter]
; 契约规范版本
specVersion = smartlab.adapter.config.v1

; 必须与 AdapterRegisterRequest.adapterName 完全一致
adapterName = TestHeatPressureAdapter-01

; adapter 总体说明
adapterDescription = 测试用加热加压adapter，支持反应单元温压控制

; INI 文件固定填写 INI；注册消息中的 rawConfigFormat 也必须为 INI
rawConfigFormat = INI


; ============================================================
; deviceTemplates[]
; 每个 [deviceTemplates.<templateName>] 代表数组中的一个模板对象。
; templateName 由 section 中的 <templateName> 自动推导，无需重复填写。
; 当前系统要求 categoryName 在一个 Adapter 中唯一。
; ============================================================

[deviceTemplates.ReactorUnitTemplate]
categoryName = ReactorUnit
categoryDescription = 设备类别描述，该类别是反应釜单元
description = 测试用反应单元通信模板


; ============================================================
; deviceTemplates[].attributes[]
; 属性名就是 JSON attributes[] 元素的 name。
; 值格式：[数据类型][描述]
; 每一个 devicePoint 都必须为模板的全部属性提供 attributeMapping。
; ============================================================

[deviceTemplates.ReactorUnitTemplate.attributes]
temperature = [DOUBLE][当前温度]
pressure = [DOUBLE][当前压力]


; ============================================================
; deviceTemplates[].commands[]
; 每个 [....commands.<commandName>] 代表一个控制指令。
; commandName 由 section 中的 <commandName> 自动推导。
; 不需要维护 parameters = a,b,c 之类的重复清单；
; 参数由对应 parameters section 中的配置项自动发现，书写顺序即展示顺序。
; ============================================================

[deviceTemplates.ReactorUnitTemplate.commands.heat]
description = 加热到目标温度


; ============================================================
; commands[].parameters[]
; 参数名就是 JSON parameters[] 元素的 name。
; 值格式：[数据类型][描述][可选修饰符]...
;
; internal=true 表示 adapter 内部执行参数，不参与系统模型映射、
; 用户表单或系统下发参数。adapter 收到 devicePoint 后，从自身配置中
; 读取 sourceField 所指定的当前设备点字段并自动注入该参数。
;
; 例如 index 的 sourceField=index，会取：
; [devicePoints.Reactor1] 中的 index = 1。
;
; internal=true 时必须同时提供 sourceField。
; 后续可扩展 [required=true]、[min=0]、[max=300] 等修饰符。
; ============================================================

[deviceTemplates.ReactorUnitTemplate.commands.heat.parameters]
targetTemperature = [DOUBLE][目标温度][internal=false]
durationSec = [INTEGER][加热持续时间，秒][internal=false]
index = [INTEGER][设备点内部编号][internal=true][sourceField=index]


[deviceTemplates.ReactorUnitTemplate.commands.pressurize]
description = 加压到目标压力

[deviceTemplates.ReactorUnitTemplate.commands.pressurize.parameters]
targetPressure = [DOUBLE][目标压力][internal=false]
durationSec = [INTEGER][加压持续时间，秒][internal=false]
index = [INTEGER][设备点内部编号][internal=true][sourceField=index]


; ============================================================
; deviceTemplates[].events.cmdEvents[]
; 指令生命周期事件。
; key 为事件 name，value 为 JSON 中的 description。
; ============================================================

[deviceTemplates.ReactorUnitTemplate.events.cmdEvents]
COMMAND_RECEIVED = 指令已接收
COMMAND_RUNNING = 指令执行中
COMMAND_COMPLETED = 指令执行完成
COMMAND_FAILED = 指令执行失败
COMMAND_TIMEOUT = 指令执行超时
COMMAND_CANCELLED = 指令已取消


; ============================================================
; deviceTemplates[].events.opEvents[]
; 设备运行/物理状态机事件。
; key 为事件 name，value 为 JSON 中的 description。
; ============================================================

[deviceTemplates.ReactorUnitTemplate.events.opEvents]
HEAT_STARTED = 开始加热
TARGET_TEMPERATURE_REACHED = 达到目标温度
PRESSURIZE_STARTED = 开始加压
TARGET_PRESSURE_REACHED = 达到目标压力
PRESSURE_ALARM = 压力报警


; ============================================================
; devicePoints[]
; 每个 [devicePoints.<devicePoint>] 对应 JSON devicePoints[] 的一条记录。
; devicePoint 由 section 中的 <devicePoint> 自动推导。
;
; 除 devicePoint/templateName/description 外，可填写任意设备点固定字段，
; 供 internal 参数的 sourceField 自动注入使用。
; ============================================================

[devicePoints.Reactor1]
templateName = ReactorUnitTemplate
description = 1号测试反应单元
index = 1

; devicePoints[].attributeMapping
; key 必须是模板中声明的属性名，value 是 adapter 的原始物理字段名。
[devicePoints.Reactor1.attributeMapping]
temperature = R1_TEMP
pressure = R1_PRESS


[devicePoints.Reactor2]
templateName = ReactorUnitTemplate
description = 2号测试反应单元
index = 2

[devicePoints.Reactor2.attributeMapping]
temperature = R2_TEMP
pressure = R2_PRESS