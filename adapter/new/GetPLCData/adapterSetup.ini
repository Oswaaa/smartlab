; SmartLab PLC 适配器物模型契约规范
; 本文件为 GetPLCData 适配器注册配置，严格遵循 SmartLab Adapter 设计规范
; 注册时作为 rawConfigContent 原文上传

[adapter]
specVersion = smartlab.adapter.config.v1
adapterName = GetPLCDataAdapter
adapterDescription = SmartLab 8通道反应釜PLC测控适配器，支持温度与压力监测与调控
rawConfigFormat = INI


; ============================================================
; deviceTemplates[]
; ============================================================

[deviceTemplates.ReactorUnitTemplate]
categoryName = ReactorUnit
categoryDescription = 设备类别描述：多通道反应釜单元
description = 反应釜单元能力模板，支持温度分段加热与压力闭环调控


; ============================================================
; deviceTemplates[].attributes[]
; ============================================================

[deviceTemplates.ReactorUnitTemplate.attributes]
temperature = [DOUBLE][当前反应温度，单位：°C]
pressure = [DOUBLE][当前反应压力，单位：MPa]


; ============================================================
; deviceTemplates[].commands[]
; ============================================================

[deviceTemplates.ReactorUnitTemplate.commands.heat]
description = 加热/调节至目标温度

[deviceTemplates.ReactorUnitTemplate.commands.heat.parameters]
targetTemperature = [DOUBLE][目标温度，单位：°C][internal=false]
durationSec = [INTEGER][加热持续时间，单位：秒][internal=false]
index = [INTEGER][反应通道编号1-8][internal=true][sourceField=index]


[deviceTemplates.ReactorUnitTemplate.commands.pressurize]
description = 加压/调节至目标压力

[deviceTemplates.ReactorUnitTemplate.commands.pressurize.parameters]
targetPressure = [DOUBLE][目标压力，单位：MPa][internal=false]
durationSec = [INTEGER][加压持续时间，单位：秒][internal=false]
index = [INTEGER][反应通道编号1-8][internal=true][sourceField=index]


[deviceTemplates.ReactorUnitTemplate.commands.setOperatingMode]
description = 设置自动或手动运行模式

[deviceTemplates.ReactorUnitTemplate.commands.setOperatingMode.parameters]
mode = [STRING][运行模式，AUTO 或 MANUAL][internal=false]
index = [INTEGER][反应通道编号1-8][internal=true][sourceField=index]


[deviceTemplates.ReactorUnitTemplate.commands.setAlarmTemp]
description = 设置反应报警温度

[deviceTemplates.ReactorUnitTemplate.commands.setAlarmTemp.parameters]
alarmTemperature = [DOUBLE][报警温度，单位：°C][internal=false]
index = [INTEGER][反应通道编号1-8][internal=true][sourceField=index]


; ============================================================
; deviceTemplates[].events.cmdEvents[]
; 指令生命周期事件
; ============================================================

[deviceTemplates.ReactorUnitTemplate.events.cmdEvents]
COMMAND_RECEIVED = 指令已接收
COMMAND_RUNNING = 指令执行中
COMMAND_COMPLETED = 指令执行完成
COMMAND_FAILED = 指令执行失败
COMMAND_TIMEOUT = 指令执行超时
COMMAND_CANCELLED = 指令已取消


; ============================================================
; deviceTemplates[].events.opEvents[]
; 设备运行/物理状态机事件
; ============================================================

[deviceTemplates.ReactorUnitTemplate.events.opEvents]
HEAT_STARTED = 开始加热
TARGET_TEMPERATURE_REACHED = 达到目标温度
PRESSURIZE_STARTED = 开始加压
TARGET_PRESSURE_REACHED = 达到目标压力
PRESSURE_ALARM = 压力报警
TEMPERATURE_ALARM = 温度报警


; ============================================================
; devicePoints[] 8个物理反应通道声明
; ============================================================

[devicePoints.Reactor1]
templateName = ReactorUnitTemplate
description = 1号反应釜单元
index = 1

[devicePoints.Reactor1.attributeMapping]
temperature = raw_temp
pressure = raw_press


