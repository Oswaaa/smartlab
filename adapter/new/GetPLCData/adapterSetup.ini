; SmartLab PLC 适配器能力契约
; 注册时本文件原文作为 rawConfigContent 上传

[adapter]
specVersion = smartlab.adapter.config.v1
adapterName = GetPLCDataAdapter
adapterDescription = 八通道反应装置 PLC 适配器，覆盖反应加热、加压、热阱、一氧化碳流量、氢气流量、保温箱、色谱、总阀和装置控制
rawConfigFormat = INI


[deviceTemplates.ReactorUnitTemplate]
categoryName = ReactorUnit
categoryDescription = 八路反应通道之一，加热程序由 PLC 执行
description = 反应通道，支持最多十段加热、后段压力加压、反应报警温度和停止加热


[deviceTemplates.ReactorUnitTemplate.attributes]
temperature = [DOUBLE][反应温度，单位°C，寄存器原值除以10]
pressure = [DOUBLE][后段压力，单位MPa，寄存器原值除以100]


[deviceTemplates.ReactorUnitTemplate.commands.heat]
description = 按temperature1到temperature10和minutes1到minutes10写入加热程序并启动。分钟数为0或留空表示该段及后续段不使用。未满10段且最后一段分钟数不是9999时，下一段自动写成9999分钟、温度与最后一段相同。启动后发TEMPERATURE_ADJUSTING。反应温度到达恒温目标后同时发TEMPERATURE_HOLDING和COMMAND_COMPLETED。不等待各段分钟数，也不等待9999分钟

[deviceTemplates.ReactorUnitTemplate.commands.heat.parameters]
temperature1 = [DOUBLE][第1段温度，单位°C][internal=false]
minutes1 = [INTEGER][第1段时间，单位分钟。0表示不使用该段及后续段][internal=false]
temperature2 = [DOUBLE][第2段温度，单位°C][internal=false]
minutes2 = [INTEGER][第2段时间，单位分钟。0表示不使用该段及后续段][internal=false]
temperature3 = [DOUBLE][第3段温度，单位°C][internal=false]
minutes3 = [INTEGER][第3段时间，单位分钟。0表示不使用该段及后续段][internal=false]
temperature4 = [DOUBLE][第4段温度，单位°C][internal=false]
minutes4 = [INTEGER][第4段时间，单位分钟。0表示不使用该段及后续段][internal=false]
temperature5 = [DOUBLE][第5段温度，单位°C][internal=false]
minutes5 = [INTEGER][第5段时间，单位分钟。0表示不使用该段及后续段][internal=false]
temperature6 = [DOUBLE][第6段温度，单位°C][internal=false]
minutes6 = [INTEGER][第6段时间，单位分钟。0表示不使用该段及后续段][internal=false]
temperature7 = [DOUBLE][第7段温度，单位°C][internal=false]
minutes7 = [INTEGER][第7段时间，单位分钟。0表示不使用该段及后续段][internal=false]
temperature8 = [DOUBLE][第8段温度，单位°C][internal=false]
minutes8 = [INTEGER][第8段时间，单位分钟。0表示不使用该段及后续段][internal=false]
temperature9 = [DOUBLE][第9段温度，单位°C][internal=false]
minutes9 = [INTEGER][第9段时间，单位分钟。0表示不使用该段及后续段][internal=false]
temperature10 = [DOUBLE][第10段温度，单位°C][internal=false]
minutes10 = [INTEGER][第10段时间，单位分钟。0表示不使用该段及后续段][internal=false]
index = [INTEGER][反应通道号，1到8][internal=true][sourceField=index]


[deviceTemplates.ReactorUnitTemplate.commands.stopHeat]
description = 将该路加热启动位写成0，并结束尚未完成的加热指令

[deviceTemplates.ReactorUnitTemplate.commands.stopHeat.parameters]
index = [INTEGER][反应通道号，1到8][internal=true][sourceField=index]


[deviceTemplates.ReactorUnitTemplate.commands.pressurize]
description = 实时读取后段压力，按压差比例分步调节：压力高于目标则松开泄压，低于目标则拧紧。每步圈数=pressureMaxStepTurns乘min(绝对压差/pressureFullStepErrorMPa,1)，默认最大0.5圈、满步压差1MPa，并受剩余行程限制。每步运动结束后等待pressureSettleSec，再用新压力读数决定下一步；这些参数及转速pressureStepSpeedRpm均在runtime.ini配置。等待期间继续读压力并允许停止。每次启动前人工拧紧作为零点，允许行程由valveTravelTurns乘valveTravelRatio确定，按指令脉冲估算而非位置反馈。开始发PRESSURE_ADJUSTING，等待后达到压力容差则发PRESSURE_HOLDING和COMMAND_COMPLETED并继续监测，偏离容差时继续分步调节。到行程边界发PRESSURE_LIMIT_REACHED，保持监测并允许反向调节；压力读取失效或电机通信异常时停止调节并发PRESSURE_CONTROL_FAILED，尚未完成的指令失败。虚拟点仅仿真压力趋近目标，不模拟电机行程和等待

[deviceTemplates.ReactorUnitTemplate.commands.pressurize.parameters]
targetPressure = [DOUBLE][目标后段压力，单位MPa][internal=false]
index = [INTEGER][反应通道号，1到8][internal=true][sourceField=index]


[deviceTemplates.ReactorUnitTemplate.commands.stopPressurize]
description = 取消该路加压调节，并通过485向电机发送停止指令；收到有效响应后发PRESSURE_STOPPED和COMMAND_COMPLETED，通信失败则发COMMAND_FAILED。尚未完成的加压指令会被取消。不写PLC，PLC离线或未取得控制权时也能执行，但需要485电机通信正常

[deviceTemplates.ReactorUnitTemplate.commands.stopPressurize.parameters]
index = [INTEGER][反应通道号，1到8][internal=true][sourceField=index]


[deviceTemplates.ReactorUnitTemplate.commands.setAlarmTemp]
description = 写入该路反应报警温度，写响应回显成功即完成

[deviceTemplates.ReactorUnitTemplate.commands.setAlarmTemp.parameters]
alarmTemperature = [DOUBLE][反应报警温度，单位°C][internal=false]
index = [INTEGER][反应通道号，1到8][internal=true][sourceField=index]


[deviceTemplates.ReactorUnitTemplate.events.cmdEvents]
COMMAND_RUNNING = 指令已开始执行
COMMAND_COMPLETED = 指令已完成
COMMAND_FAILED = 指令失败，原因在payload

[deviceTemplates.ReactorUnitTemplate.events.opEvents]
TEMPERATURE_ADJUSTING = 加热程序已启动，反应温度正在走向恒温目标
TEMPERATURE_HOLDING = 反应温度已到达恒温目标，设备保持在该温度
HEATING_STOPPED = 该路加热已停止
PRESSURE_ADJUSTING = 已开始按目标后段压力调节
PRESSURE_HOLDING = 后段压力已到达目标，设备保持在该压力
PRESSURE_STOPPED = 该路加压调节已取消，电机停止指令已收到有效响应；虚拟点表示仿真调压已取消
PRESSURE_LIMIT_REACHED = 触及允许行程边界，禁止继续向该方向转动，保持压力监测并允许反向调节。payload含MIN/MAX、当前压力、目标压力和估算开度范围
PRESSURE_CONTROL_FAILED = 压力反馈失效或电机通信/报警异常，已取消调节并尝试停止电机。payload含reason和motorStopConfirmed


[deviceTemplates.HeatsinkTemplate]
categoryName = Heatsink
categoryDescription = 八路热阱之一
description = 热阱，支持设温度和报警温度


[deviceTemplates.HeatsinkTemplate.attributes]
