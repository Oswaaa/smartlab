[deviceTemplates.HeatsinkTemplate.commands.setTemp]
description = 写入热阱设定温度。开始调节时发TEMPERATURE_ADJUSTING。实测温度与目标之差不超过temperatureTolerance时同时发TEMPERATURE_HOLDING和COMMAND_COMPLETED，默认必须完全一致。到达后继续维持，没有回到空闲的事件
[deviceTemplates.HeatsinkTemplate.commands.setTemp.parameters]
temperature = [DOUBLE][目标温度，单位°C][internal=false]
index = [INTEGER][热阱通道号，1到8][internal=true][sourceField=index]


[deviceTemplates.HeatsinkTemplate.commands.setAlarmTemp]
description = 写入热阱报警温度，写响应回显成功即完成

[deviceTemplates.HeatsinkTemplate.commands.setAlarmTemp.parameters]
alarmTemperature = [DOUBLE][报警温度，单位°C][internal=false]
index = [INTEGER][热阱通道号，1到8][internal=true][sourceField=index]


[deviceTemplates.HeatsinkTemplate.events.cmdEvents]
COMMAND_RUNNING = 指令已开始执行
COMMAND_COMPLETED = 指令已完成
COMMAND_FAILED = 指令失败，原因在payload

[deviceTemplates.HeatsinkTemplate.events.opEvents]
TEMPERATURE_ADJUSTING = 热阱设定温度已写入，实测温度正在走向目标
TEMPERATURE_HOLDING = 热阱温度已到达目标，设备保持在该温度


[deviceTemplates.GasFlowTemplate]
categoryName = GasFlow
categoryDescription = 通道上的一路气体流量计
description = 同一类流量计。点位 CoFlow 使用流量计1，点位 H2Flow 使用流量计2


[deviceTemplates.GasFlowTemplate.attributes]
flow = [DOUBLE][流量显示]


[deviceTemplates.GasFlowTemplate.commands.setFlow]
description = 写入该路流量设定。开始调节时发FLOW_ADJUSTING。流量显示与设定一致时同时发FLOW_HOLDING和COMMAND_COMPLETED。到达后继续维持，没有回到空闲的事件

[deviceTemplates.GasFlowTemplate.commands.setFlow.parameters]
flow = [DOUBLE][流量设定][internal=false]
index = [INTEGER][通道号，1到8][internal=true][sourceField=index]
meter = [INTEGER][流量计编号。1为一氧化碳点位，2为氢气点位][internal=true][sourceField=meter]


[deviceTemplates.GasFlowTemplate.events.cmdEvents]
COMMAND_RUNNING = 指令已开始执行
COMMAND_COMPLETED = 指令已完成
COMMAND_FAILED = 指令失败，原因在payload

[deviceTemplates.GasFlowTemplate.events.opEvents]
FLOW_ADJUSTING = 流量设定已写入，显示值正在走向设定
FLOW_HOLDING = 流量显示已到达设定，设备保持该流量


