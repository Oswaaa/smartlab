[deviceTemplates.PlantTemplate]
categoryName = PlantControl
categoryDescription = 整套装置共用的接管、使能和消音
description = 装置控制点。除接管和释放外，其余写操作要求手自动寄存器已经是1


[deviceTemplates.PlantTemplate.attributes]
ourControl = [BOOLEAN][true表示本系统接管，对应手自动寄存器为1]
enable1 = [BOOLEAN][使能1]
enable2 = [BOOLEAN][使能2]
enable3 = [BOOLEAN][使能3]
enable4 = [BOOLEAN][使能4]
enable5 = [BOOLEAN][使能5]
enable6 = [BOOLEAN][使能6]
enable7 = [BOOLEAN][使能7]
enable8 = [BOOLEAN][使能8]
enable9 = [BOOLEAN][使能9]


[deviceTemplates.PlantTemplate.commands.takeControl]
description = 先现场读取并保存Addr_0到Addr_296，再将手自动寄存器267写成1。随后优先恢复报警温度，现场值为0的报警温度默认写入300；每个寄存器写入后立即读取核对。其余设定也逐个写入并读取核对，使能位和启动位最后恢复。实测温度、压力和流量反馈不写回；全部恢复且267确认仍为1后才报告接管成功


[deviceTemplates.PlantTemplate.commands.releaseControl]
description = 将手自动寄存器写成0，把控制权交回另一套软件


[deviceTemplates.PlantTemplate.commands.setEnable]
description = 写使能1到9。1为使能，0为关闭。写响应回显成功即完成

[deviceTemplates.PlantTemplate.commands.setEnable.parameters]
enableId = [INTEGER][使能编号，1到9][internal=false]
enabled = [BOOLEAN][true为使能，false为关闭][internal=false]


[deviceTemplates.PlantTemplate.commands.setAlarmMute]
description = 写报警消音。写响应回显成功即完成

[deviceTemplates.PlantTemplate.commands.setAlarmMute.parameters]
muted = [BOOLEAN][true为消音，false为取消消音][internal=false]


[deviceTemplates.PlantTemplate.events.cmdEvents]
COMMAND_RUNNING = 指令已开始执行
COMMAND_COMPLETED = 指令已完成
COMMAND_FAILED = 指令失败，原因在payload

[deviceTemplates.PlantTemplate.events.opEvents]
CONTROL_TAKEN = 本系统已接管装置
CONTROL_RELEASED = 控制权已交回另一套软件


