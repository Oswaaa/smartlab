; 本地运行时配置（不随注册报文上传）
; 包含 MQTT Broker、仿真微批次规约、以及物理设备 Modbus/485 地址

[smartlab]
broker = 127.0.0.1
port = 1883
username = adapter
password = 123456
clientId = smartlab_getplcdata_adapter
keepAliveSec = 30
qos = 1

[runtime]
heartbeatIntervalSec = 10

[logging]
level = INFO

[simulation]
; 加快倍数 K = batchSize * simStepMs / (intervalSec * 1000)
; 当前 20 * 1000 / 500 = 40 倍
batchSize = 20
intervalSec = 0.5
simStepMs = 1000

[plc]
ip = 192.168.0.10
port = 502
timeoutSec = 3.0
pollIntervalSec = 1.0
chunkGapMs = 50
linkTimeoutSec = 30
; 读数先除以 10 再与恒温温度比较。0 表示必须完全一致
temperatureTolerance = 0
; 后段压力，单位 MPa。到达该误差后发 PRESSURE_HOLDING 和 COMMAND_COMPLETED
pressureTolerance = 0.01

[rs485]
ip = 192.168.0.201
port = 26
timeoutSec = 2.0
; 开度记在 valve-travel.json。文件不存在时八路从最紧起算，启动前需人工拧到最紧。
; 重启后读取该文件。修改每圈脉冲或允许圈数后，旧文件不再沿用。
valveTravelFile = valve-travel.json
pulsesPerTurn = 3200
; 阀门从最紧到最松的最大总圈数，可修改；暂按3圈填写，待现场确认。
valveTravelTurns = 3
; 实际允许松开圈数 = 最大总圈数 × 此比例；当前为3 × 0.9 = 2.7圈。
valveTravelRatio = 0.9
; 沿用旧方向：1 松开泄压，0 拧紧；若安装方向相反可改为0。
openingDirection = 1
; 持续现场读取八路压力；等待期间仍读取，实际周期包括通信耗时。
pressurePollIntervalSec = 0.2
pressureFreshSec = 3
; 按压差比例分步调节，不使用PID；每步后仍停下来等待压力响应。
; 每步圈数 = 单步上限 × min(绝对压差 / 满步压差, 1)，并受剩余行程限制。
pressureMaxStepTurns = 0.5
; 压差单位MPa：差0.2转0.1圈，差0.5转0.25圈，差1及以上转0.5圈。
pressureFullStepErrorMPa = 1
; 小步转动速度，单位rpm，支持整数2到100。
pressureStepSpeedRpm = 10
; 每步运动结束后等待的秒数；等待结束后用新压力读数决定下一步。
pressureSettleSec = 2
