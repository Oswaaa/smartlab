; 本地运行时配置（不随注册报文上传）
; 包含 MQTT Broker、仿真微批次规约、以及物理设备 Modbus/485 地址

[smartlab]
broker = 127.0.0.1
port = 1883
username = adapter
password = adapter
clientId = smartlab_getplcdata_adapter
keepAliveSec = 30
qos = 1

[runtime]
heartbeatIntervalSec = 10

[logging]
level = INFO

[simulation]
; 每次发送打包的点数（规范推荐 10~100）
batchSize = 20
; 发送周期（秒，推荐 0.2~1.0）
intervalSec = 0.5
; 每个数据点对应的虚拟推演步长（毫秒，默认 1000ms=1秒）
simStepMs = 1000

; 设备专有段（仅供 control.py 读取）
[plc]
; Modbus TCP PLC 服务端地址与端口
ip = 192.168.0.10
port = 502
timeoutSec = 3.0
pollIntervalSec = 1.0

[rs485]
; 485 电机加压控制器网关地址与端口
ip = 192.168.0.201
port = 26
timeoutSec = 2.0
