; Four templates share one controller. Output channels are fixed per device point.
[adapter]
specVersion = smartlab.adapter.config.v1
adapterName = MotionStageAdapter
adapterDescription = 三轴机械臂、八路电磁阀、气动矫正器和视觉检测
rawConfigFormat = INI

[deviceTemplates.ArmTemplate]
categoryName = ThreeAxisArm
categoryDescription = ThreeAxisArm
description = 三轴整体机构，含第0路夹爪；不包含阀门或视觉命令

[deviceTemplates.ArmTemplate.attributes]
axis1_pos = [INTEGER][1轴位置，脉冲]
axis1_status = [STRING][1轴状态：运动中、到位、急停、报警、限位]
axis2_pos = [INTEGER][2轴位置，脉冲]
axis2_status = [STRING][2轴状态：运动中、到位、急停、报警、限位]
axis3_pos = [INTEGER][3轴位置，脉冲]
axis3_status = [STRING][3轴状态：运动中、到位、急停、报警、限位]
gripperOpen = [BOOLEAN][夹爪开闭状态，true为开，false为关]

[deviceTemplates.ArmTemplate.commands.MoveAbsolute]
description = 单轴定位；规划脉冲位置与目标相差不到10个脉冲后完成

[deviceTemplates.ArmTemplate.commands.MoveAbsolute.parameters]
axis = [INTEGER][轴号1到3，缺省1][internal=false]
position = [INTEGER][目标位置，脉冲，缺省0][internal=false]

[deviceTemplates.ArmTemplate.commands.Jog]
description = 点动一次。X、Y轴内部速度1脉冲/毫秒，Z轴10脉冲/毫秒，约200毫秒后自行停止

[deviceTemplates.ArmTemplate.commands.Jog.parameters]
axis = [INTEGER][轴号1到3，缺省1][internal=false]
dir = [INTEGER][1正向，0或-1负向][internal=false]

[deviceTemplates.ArmTemplate.commands.Stop]
description = 停止全部轴并取消定位和回零，等待停稳

[deviceTemplates.ArmTemplate.commands.ResetMotion]
description = 按原限位顺序回零，含超时和停止取消

[deviceTemplates.ArmTemplate.commands.SetGripper]
description = 开关夹爪。1打开，0闭合，写完回读后完成

[deviceTemplates.ArmTemplate.commands.SetGripper.parameters]
Value = [INTEGER][1打开夹爪，0闭合夹爪][internal=false]

[deviceTemplates.ArmTemplate.events.cmdEvents]
COMMAND_RECEIVED = 指令已接收
COMMAND_RUNNING = 指令处理中；不等同于轴正在运动
COMMAND_COMPLETED = 按该能力定义完成
COMMAND_FAILED = 指令失败，payload.errorCode和message说明原因

[deviceTemplates.ArmTemplate.events.opEvents]
MOVING = 移动中
STOPPED = 静止
GRIPPER_OPENED = 夹爪已打开
GRIPPER_CLOSED = 夹爪已关闭

[deviceTemplates.SolenoidValveTemplate]
categoryName = SolenoidValve
categoryDescription = SolenoidValve
description = 第1至8路普通电磁阀；输出回读确认后完成

[deviceTemplates.SolenoidValveTemplate.attributes]
isOpen = [BOOLEAN][阀门开闭状态，true为开，false为关]

[deviceTemplates.SolenoidValveTemplate.commands.SetExtDoBit]
description = 设置本设备点固定输出，回读确认

[deviceTemplates.SolenoidValveTemplate.commands.SetExtDoBit.parameters]
BitIndex = [INTEGER][内部固定输出位号][internal=true][sourceField=bitIndex]
Value = [INTEGER][输出电平0或1；机械开关含义由接线决定][internal=false]

[deviceTemplates.SolenoidValveTemplate.events.cmdEvents]
COMMAND_RECEIVED = 指令已接收
COMMAND_RUNNING = 指令处理中；不等同于轴正在运动
COMMAND_COMPLETED = 按该能力定义完成
COMMAND_FAILED = 指令失败，payload.errorCode和message说明原因

[deviceTemplates.SolenoidValveTemplate.events.opEvents]
VALVE_OPENED = 阀门已打开
VALVE_CLOSED = 阀门已关闭

[deviceTemplates.PneumaticCorrectorTemplate]
categoryName = PneumaticCorrector
categoryDescription = PneumaticCorrector
description = 第9路气动矫正器；切换输出后等待2秒，不自动反向

[deviceTemplates.PneumaticCorrectorTemplate.attributes]
isOpen = [BOOLEAN][矫正器开闭状态，true为开，false为关]

[deviceTemplates.PneumaticCorrectorTemplate.commands.SetExtDoBit]
description = 切换输出并等待配置时间，0和1均等待

[deviceTemplates.PneumaticCorrectorTemplate.commands.SetExtDoBit.parameters]
BitIndex = [INTEGER][内部固定输出位号][internal=true][sourceField=bitIndex]
Value = [INTEGER][输出电平0或1；机械开关含义由接线决定][internal=false]

[deviceTemplates.PneumaticCorrectorTemplate.events.cmdEvents]
COMMAND_RECEIVED = 指令已接收
COMMAND_RUNNING = 指令处理中；不等同于轴正在运动
COMMAND_COMPLETED = 按该能力定义完成
COMMAND_FAILED = 指令失败，payload.errorCode和message说明原因

[deviceTemplates.PneumaticCorrectorTemplate.events.opEvents]
CORRECTOR_OPENED = 矫正器已打开
CORRECTOR_CLOSED = 矫正器已关闭

[deviceTemplates.VisionTemplate]
categoryName = VisionInspection
categoryDescription = VisionInspection
description = 按视觉服务字符串判断指定管子是否合上

[deviceTemplates.VisionTemplate.attributes]
tube1_closed = [BOOLEAN][第1个管子是否合上]
tube2_closed = [BOOLEAN][第2个管子是否合上]
tube3_closed = [BOOLEAN][第3个管子是否合上]
tube4_closed = [BOOLEAN][第4个管子是否合上]

[deviceTemplates.VisionTemplate.commands.VisionCheck]
description = 查询指定管子是否已经合上

[deviceTemplates.VisionTemplate.commands.VisionCheck.parameters]
tube = [INTEGER][管子编号，1到4][internal=false]

[deviceTemplates.VisionTemplate.events.cmdEvents]
COMMAND_RECEIVED = 指令已接收
COMMAND_RUNNING = 指令处理中；不等同于轴正在运动
COMMAND_COMPLETED = 按该能力定义完成
COMMAND_FAILED = 指令失败，payload.errorCode和message说明原因

[deviceTemplates.VisionTemplate.events.opEvents]
TUBE1_CLOSED = 第1个管子已合上
TUBE2_CLOSED = 第2个管子已合上
TUBE3_CLOSED = 第3个管子已合上
TUBE4_CLOSED = 第4个管子已合上

