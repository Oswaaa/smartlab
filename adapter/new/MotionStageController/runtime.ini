; 本地部署。Broker 默认值与旧 setup.ini 的 [MQTT] 一致，不随注册上传。

[smartlab]
broker = 127.0.0.1
port = 1883
username = admin
password = 123456
; clientId 只是 MQTT 客户端标识。旧物理点 reactor_001 已拆成 adapterSetup.ini 里的十一个设备点。
clientId = reactor_001
keepAliveSec = 30
qos = 1

[runtime]
heartbeatIntervalSec = 10

[logging]
level = INFO

[simulation]
batchSize = 20
intervalSec = 0.5
simStepMs = 1000

[card]
localIp = 192.168.0.90
cardIp = 192.168.0.199
localPort = 60000
cardPort = 60000
dllPath = D:\SmartLab2.0\adapter\new\MotionStageController\MultiCard.dll
; 板卡打不开时北向仍启动；后台按该间隔重试 MC_Open
reconnectIntervalSec = 5
; 上报的轴位置是脉冲坐标。true 时，到位判断同时核对编码器读数。
encoderFeedbackEnabled = false
; 首次读取失败即上报离线；连续失败达到该次数才关闭旧连接并重连
pollFailureTolerance = 3
; 通过 MC_GetSts 回读板卡采样时钟，防止旧连接/缓存持续假在线
healthProbeIntervalMs = 1000
; 轮询或板卡时钟超过该时间未更新，独立看门狗撤销在线状态
healthTimeoutMs = 5000
; 本机卡固件不维护 MC_GetSts 的采样时钟（实测恒定 0xCCCCCCCC，6 秒不变），
; 时钟既不递增也不可信，置 false 关闭时钟判据；通信存活由轴状态/DI 往返体现。
; 换成时钟正常的卡或固件修好后改回 true 即恢复原有保护。
clockHealthEnabled = false
; 阀门、矫正器、夹爪输出位的定时回读间隔；指令写入时会立即回读确认
ioPollIntervalMs = 1000

; 视觉查询由独立线程访问，不进入运动轮询、点动看门狗和第九路等待。
[vision]
statusUrl = http://127.0.0.1:8089/status
requestTimeoutSec = 2
maxAttempts = 10
retryIntervalMs = 200

; 运动参数。速度单位是脉冲/ms，加速度单位是脉冲/ms²，与 MultiCard 的 MC_SetVel / MC_SetTrapPrm 一致。
; 下面的缺省值就是旧 MotionController.cpp 里的常数。真机和仿真读同一份。
[motion]
stopDecSmooth = 0.5
stopDecAbrupt = 5
moveAcc1 = 0.05
moveDec1 = 0.05
moveAcc2 = 0.07
moveDec2 = 0.07
moveAcc3 = 0.05
moveDec3 = 0.05
moveSmoothTime = 50
moveVelStart = 0
moveVel1 = 80
moveVel2 = 25
moveVel3 = 3
moveArriveBand = 10
homeTimeoutMs = 120000
stopTimeoutMs = 10000
jogAcc = 0.5
jogDec = 0.5
jogSmooth = 0.1
jogSpeedX = 1
jogSpeedY = 1
jogSpeedZ = 10
jogWatchdogMs = 200
homeJogAcc = 0.1
homeJogDec = 0.1
homeJogSmooth = 0
homeSeekVel1 = 50
homeSeekVel2 = 25
homeSeekVel3 = 15
homeFastPos = 50000
homeFastVel = 1500
homeFastAcc = 10
homeFastDec = 1
homeFastSmooth = 0
homeReturnVel = 25
homeAxis2Pos = 5000
homeAxis3Pos = 1000
homePlaceVel2 = 50
homePlaceVel3 = 50
homePlaceAcc = 0.1
homePlaceDec = 0.1
homeAxis2Smooth = 150
homeAxis3Smooth = 0
homeCreepVel = 1
softLimitWide1 = -2147483645
softLimitWide2 = 2147483647
softLimit1A = -1000
softLimit1B = 1900000
softLimit2A = -100
softLimit2B = 430000
softLimit3A = -10
softLimit3B = 45000
extDoHoldBit = 9
extDoHoldMs = 2000
loopPeriodMs = 100
; 值变化立即上报；值不变时每隔这么多个轮询周期补报一次。
telemetryEveryLoops = 10
; 仅仿真使用。0 表示虚拟电机开机就停在负限位上，离开后只有再回到该坐标才置位。
negLimitPos1 = 0
negLimitPos2 = 0
negLimitPos3 = 0
