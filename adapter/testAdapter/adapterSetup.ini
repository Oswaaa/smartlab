; SmartLab PLC Adapter 公开注册配置。
; 本文件会完整发送给 SmartLab；MQTT 地址和凭据只保存在 runtime.ini。

[adapter]
specVersion = smartlab.adapter.config.v1
adapterName = PLCControllerAdapter
adapterDescription = PLC 温度监测与控制 Adapter
rawConfigFormat = INI

[deviceTemplates.PLCThermalController]
categoryName = PLCController
categoryDescription = PLC 温控设备
description = 提供温度遥测、运行模式、散热与报警控制

[deviceTemplates.PLCThermalController.attributes]
temperature = [DOUBLE][当前温度]

[deviceTemplates.PLCThermalController.commands.setOperatingMode]
description = 设置自动或手动运行模式

[deviceTemplates.PLCThermalController.commands.setOperatingMode.parameters]
mode = [STRING][运行模式，AUTO 或 MANUAL][internal=false]

[deviceTemplates.PLCThermalController.commands.setCooling]
description = 开启或关闭散热

[deviceTemplates.PLCThermalController.commands.setCooling.parameters]
enabled = [BOOLEAN][是否开启散热][internal=false]

[deviceTemplates.PLCThermalController.commands.setAlarm]
description = 开启或关闭报警

[deviceTemplates.PLCThermalController.commands.setAlarm.parameters]
enabled = [BOOLEAN][是否开启报警][internal=false]

[deviceTemplates.PLCThermalController.events.cmdEvents]
COMMAND_RECEIVED = 指令已接收
COMMAND_RUNNING = 指令执行中
COMMAND_COMPLETED = 指令执行完成
COMMAND_FAILED = 指令执行失败
COMMAND_TIMEOUT = 指令执行超时

[deviceTemplates.PLCThermalController.events.opEvents]
AUTOMATIC_MODE_ENTERED = 已进入自动模式
MANUAL_MODE_ENTERED = 已进入手动模式
COOLING_STARTED = 散热已开启
COOLING_STOPPED = 散热已关闭
ALARM_TRIGGERED = 报警已触发
ALARM_CLEARED = 报警已解除

[devicePoints.PLC1]
templateName = PLCThermalController
description = PLC 控制器

[devicePoints.PLC1.attributeMapping]
temperature = temperature
