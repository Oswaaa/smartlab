; SmartLab Adapter 原始契约配置。
; 标识符不能包含 "."；属性/参数格式为 [数据类型][描述][可选修饰符]。

[adapter]
specVersion = smartlab.adapter.config.v1
adapterName = PLCAdapter
adapterDescription = 采集温控单元温度并控制运行模式与散热输出
rawConfigFormat = INI

[deviceTemplates.PLCThermalTemplate]
categoryName = PLCThermalUnit
categoryDescription = 支持温度采集、运行模式切换和散热控制 of PLC 单元
description = 温控单元数据采集与控制模板

[deviceTemplates.PLCThermalTemplate.attributes]
temperature = [DOUBLE][当前温度]
coolingEnabled = [BOOLEAN][散热状态]
automaticMode = [BOOLEAN][自动模式]
manualMode = [BOOLEAN][手动模式]

[deviceTemplates.PLCThermalTemplate.commands.setOperatingMode]
description = 切换 PLC 自动或手动运行模式

[deviceTemplates.PLCThermalTemplate.commands.setOperatingMode.parameters]
mode = [STRING][运行模式：AUTO 或 MANUAL][internal=false]
deviceSN = [STRING][PLC 设备序列号][internal=true][sourceField=deviceSN]

[deviceTemplates.PLCThermalTemplate.commands.setCooling]
description = 设置散热输出；开启散热前 PLC 必须处于手动模式

[deviceTemplates.PLCThermalTemplate.commands.setCooling.parameters]
enabled = [BOOLEAN][true 开启散热，false 关闭散热][internal=false]
deviceSN = [STRING][PLC 设备序列号][internal=true][sourceField=deviceSN]

[deviceTemplates.PLCThermalTemplate.events.cmdEvents]
COMMAND_RECEIVED = Adapter 已接收系统指令
COMMAND_RUNNING = 指令执行中
COMMAND_COMPLETED = 指令执行成功
COMMAND_ABORTED = 指令终止执行
COMMAND_FAILED = 指令执行失败

[deviceTemplates.PLCThermalTemplate.events.opEvents]
AUTOMATIC_MODE_ENTERED = PLC 已进入自动模式
MANUAL_MODE_ENTERED = PLC 已进入手动模式
COOLING_STARTED = PLC 散热输出已开启
COOLING_STOPPED = PLC 散热输出已关闭

[devicePoints.0001]
templateName = PLCThermalTemplate
description = 温控单元0001
deviceSN = plc0001

[devicePoints.0001.attributeMapping]
temperature = MW0
coolingEnabled = MW20
automaticMode = MW21
manualMode = MW22
