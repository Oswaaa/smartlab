; Adapter 本地运行配置。该文件不会发送给 SmartLab 系统。
; 修改 Broker、认证、Client ID 或 Topic 后，重启 Adapter 即会直接生效。
; Python 代码不内置这些值，也不会覆盖本文件配置。
; Topic 可使用 {adapterName}、{devicePoint} 占位符；订阅 Topic 可使用 MQTT 通配符 +/#。

[mqtt]
host = 192.168.11.178
port = 1883
username = plc
password = 123456
clientId = adapter_test_client
keepAliveSec = 30
qos = 1

[runtime]
heartbeatIntervalSec = 10
commandTimeoutSec = 10
logLevel = INFO

[systemTopics]
register = smartlab/adapter/register
heartbeat = smartlab/adapter/{adapterName}/heartbeat
command = smartlab/adapter/{adapterName}/+/command
telemetry = smartlab/adapter/{adapterName}/{devicePoint}/telemetry
event = smartlab/adapter/{adapterName}/{devicePoint}/event

[plcTopics]
command = plc/{devicePoint}/command
telemetry = plc/{devicePoint}/data
