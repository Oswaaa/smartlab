<path d="M 1590 430 L 1590 240" fill="none" stroke="#168270" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="1614" y="326" text-anchor="start" font-size="28" font-weight="400" fill="#168270">状态 / 数据反馈</text>
<rect x="625" y="550" width="455" height="155" fill="#FFF8E5" stroke="#586D7D" stroke-width="1.8"/>
<rect x="625" y="550" width="455" height="48" fill="#F5E4B0" stroke="#586D7D" stroke-width="1.8"/>
<text x="647" y="584" text-anchor="start" font-size="32" font-weight="700" fill="#193B58">模拟执行</text>
<text x="852" y="639" text-anchor="middle" font-size="28" font-weight="400" fill="#193B58">在 Adapter 内模拟指令</text>
<text x="852" y="680" text-anchor="middle" font-size="28" font-weight="400" fill="#193B58">生成模拟状态与数据</text>
<rect x="1360" y="550" width="455" height="155" fill="#FFF8E5" stroke="#586D7D" stroke-width="1.8"/>
<rect x="1360" y="550" width="455" height="48" fill="#F5E4B0" stroke="#586D7D" stroke-width="1.8"/>
<text x="1382" y="584" text-anchor="start" font-size="32" font-weight="700" fill="#193B58">真机执行</text>
<text x="1587" y="639" text-anchor="middle" font-size="28" font-weight="400" fill="#193B58">映射设备协议并下发指令</text>
<text x="1587" y="680" text-anchor="middle" font-size="28" font-weight="400" fill="#193B58">接收测量与运行状态</text>
