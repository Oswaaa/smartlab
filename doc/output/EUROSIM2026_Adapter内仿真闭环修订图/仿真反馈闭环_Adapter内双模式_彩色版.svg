<text x="220" y="363" text-anchor="middle" font-size="27" font-weight="400" fill="#168270">状态、数据与约束结果</text>
<text x="220" y="402" text-anchor="middle" font-size="27" font-weight="400" fill="#168270">反馈驱动方案调整</text>
<rect x="580" y="350" width="1300" height="380" fill="#FFF8E5" stroke="#586D7D" stroke-width="1.8"/>
<rect x="580" y="350" width="1300" height="48" fill="#F5E4B0" stroke="#586D7D" stroke-width="1.8"/>
<text x="602" y="384" text-anchor="start" font-size="32" font-weight="700" fill="#193B58">Adapter：模拟执行 / 真机执行</text>
