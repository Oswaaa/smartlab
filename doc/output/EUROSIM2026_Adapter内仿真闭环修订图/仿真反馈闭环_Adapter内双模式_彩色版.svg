<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="880" viewBox="0 0 2000 880"><title>Adapter 内的模拟执行与真机执行闭环</title><desc>同一 Adapter 内包含模拟执行和真机执行两种模式。先模拟，反馈沿共同模型返回大模型；模拟检查通过后切换真机模式，仅真机模式连接物理设备。</desc><defs><marker id="blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#235F9A"/></marker><marker id="green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#168270"/></marker><marker id="orange" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#B86626"/></marker></defs><style>text{font-family:'Microsoft YaHei','微软雅黑',sans-serif}</style><rect width="2000" height="880" fill="#FFFFFF"/><rect x="40" y="65" width="360" height="220" fill="#EFF4FA" stroke="#586D7D" stroke-width="1.8"/>
<rect x="40" y="65" width="360" height="48" fill="#CCDEEF" stroke="#586D7D" stroke-width="1.8"/>
<text x="62" y="99" text-anchor="start" font-size="32" font-weight="700" fill="#193B58">大模型</text>
<text x="220" y="150" text-anchor="middle" font-size="34" font-weight="700" fill="#193B58">决策与调整</text>
<text x="220" y="205" text-anchor="middle" font-size="28" font-weight="400" fill="#193B58">提出方案与控制请求</text>
<text x="220" y="251" text-anchor="middle" font-size="28" font-weight="400" fill="#193B58">依据反馈调整方案</text>
<rect x="580" y="20" width="1300" height="220" fill="#EFF4FA" stroke="#586D7D" stroke-width="1.8"/>
<rect x="580" y="20" width="1300" height="48" fill="#CCDEEF" stroke="#586D7D" stroke-width="1.8"/>
<text x="602" y="54" text-anchor="start" font-size="32" font-weight="700" fill="#193B58">共同模型与执行机制</text>
<rect x="610" y="90" width="390" height="120" fill="#EFF4FA" stroke="#586D7D" stroke-width="1.8"/>
<text x="805" y="132" text-anchor="middle" font-size="33" font-weight="700" fill="#193B58">工作流</text>
<text x="805" y="178" text-anchor="middle" font-size="28" font-weight="400" fill="#193B58">任务步骤与节点交互</text>
<rect x="1030" y="90" width="390" height="120" fill="#F1F6EB" stroke="#586D7D" stroke-width="1.8"/>
<text x="1225" y="132" text-anchor="middle" font-size="33" font-weight="700" fill="#193B58">设备模型</text>
<text x="1225" y="178" text-anchor="middle" font-size="28" font-weight="400" fill="#193B58">能力模型与状态机</text>
<rect x="1450" y="90" width="400" height="120" fill="#FFF3E9" stroke="#586D7D" stroke-width="1.8"/>
<text x="1650" y="132" text-anchor="middle" font-size="33" font-weight="700" fill="#193B58">约束</text>
<text x="1650" y="178" text-anchor="middle" font-size="28" font-weight="400" fill="#193B58">运行规则与边界检查</text>
<path d="M 400 165 L 580 165" fill="none" stroke="#235F9A" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#blue)"/>
