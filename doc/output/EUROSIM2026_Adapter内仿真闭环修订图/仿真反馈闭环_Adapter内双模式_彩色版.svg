<path d="M 970 550 L 970 485" fill="none" stroke="#168270" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M 1460 485 L 1460 550" fill="none" stroke="#235F9A" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="1542" y="525" text-anchor="middle" font-size="26" font-weight="400" fill="#235F9A">通过检查后</text>
<path d="M 1690 550 L 1690 485" fill="none" stroke="#168270" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M 1080 630 L 1360 630" fill="none" stroke="#B86626" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#orange)"/>
<text x="1220" y="600" text-anchor="middle" font-size="28" font-weight="400" fill="#B86626">模拟检查通过</text>
<text x="1220" y="680" text-anchor="middle" font-size="27" font-weight="400" fill="#B86626">切换为真机模式</text>
<text x="855" y="783" text-anchor="middle" font-size="27" font-weight="400" fill="#B86626">未通过检查：继续模拟与调整</text>
<rect x="1360" y="790" width="455" height="80" fill="#F5F7F8" stroke="#586D7D" stroke-width="1.8"/>
<text x="1587" y="824" text-anchor="middle" font-size="32" font-weight="700" fill="#193B58">物理设备</text>
<text x="1587" y="858" text-anchor="middle" font-size="26" font-weight="400" fill="#193B58">执行操作，产生实际反馈</text>
<path d="M 1460 705 L 1460 790" fill="none" stroke="#235F9A" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="1400" y="765" text-anchor="middle" font-size="26" font-weight="400" fill="#235F9A">指令</text>
<path d="M 1690 790 L 1690 705" fill="none" stroke="#168270" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="1770" y="765" text-anchor="middle" font-size="26" font-weight="400" fill="#168270">实际反馈</text></svg>