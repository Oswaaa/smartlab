<text x="769" y="149" font-size="38" font-weight="400" text-anchor="start" fill="#000000">任务步骤</text>
<text x="769" y="345" font-size="38" font-weight="400" text-anchor="start" fill="#000000">设备能力与属性</text>
<text x="769" y="394" font-size="38" font-weight="400" text-anchor="start" fill="#000000">状态转移</text>
<text x="769" y="551" font-size="38" font-weight="400" text-anchor="start" fill="#000000">协议映射</text>
