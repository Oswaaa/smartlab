<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="780" viewBox="0 0 1470 780" role="img" aria-labelledby="title desc"><title id="title">统一执行链路</title><desc id="desc">人工、流程和大模型的控制请求与工作流节点请求汇入共同执行入口，进入设备模型中的状态机。状态机通过 Adapter 控制物理设备，状态反馈沿原路返回。约束层观察工作流上下文和资源状态，并将处理动作返回状态机。</desc><defs><marker id="control" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#000000"/></marker><marker id="feedback" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#000000"/></marker><marker id="constraint" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#000000"/></marker><marker id="observe" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#000000"/></marker></defs><style>text{font-family:'Microsoft YaHei','微软雅黑',sans-serif}</style><rect width="1470" height="780" fill="#FFFFFF"/><rect x="340" y="58" width="380" height="100" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="2.2"/>
<text x="530" y="119" font-size="44" font-weight="600" text-anchor="middle" fill="#000000">工作流节点</text>
<rect x="340" y="284" width="380" height="174" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="2.2"/>
<text x="435" y="331" font-size="42" font-weight="600" text-anchor="middle" fill="#000000">设备模型</text>
<rect x="354" y="370" width="173" height="68" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="2.2"/>
<text x="441" y="415" font-size="38" font-weight="400" text-anchor="middle" fill="#000000">能力模型</text>
<rect x="539" y="370" width="165" height="68" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="2.2"/>
<text x="622" y="415" font-size="40" font-weight="600" text-anchor="middle" fill="#000000">状态机</text>
<rect x="340" y="522" width="380" height="84" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="2.2"/>
<text x="530" y="578" font-size="44" font-weight="600" text-anchor="middle" fill="#000000">Adapter</text>
