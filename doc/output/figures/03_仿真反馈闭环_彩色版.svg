<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="780" viewBox="0 0 1470 780" role="img" aria-labelledby="title desc"><title id="title">仿真反馈闭环</title><desc id="desc">大模型决策经共同模型区进入仿真 Adapter 和模拟环境，反馈用于方案调整。仿真与实机共用工作流、设备能力与状态机、约束。共同模型区的实机分支经预设上机条件判定后进入实机 Adapter 和物理设备；仿真评估作为上机依据，实机反馈返回共同模型区。</desc><defs><marker id="control" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#245E96"/></marker><marker id="feedback" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#187B66"/></marker><marker id="constraint" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#A85E18"/></marker><marker id="observe" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#66747D"/></marker></defs><style>text{font-family:'Microsoft YaHei','微软雅黑',sans-serif}</style><rect width="1470" height="780" fill="#FFFFFF"/><rect x="24" y="72" width="280" height="145" rx="8" fill="#EDF3F8" stroke="#245E96" stroke-width="2.2"/>
<text x="164" y="128" font-size="44" font-weight="600" text-anchor="middle" fill="#1C3C5D">大模型决策</text>
<text x="164" y="183" font-size="38" font-weight="400" text-anchor="middle" fill="#1C3C5D">提出控制请求</text>
<rect x="435" y="40" width="570" height="238" rx="8" fill="#EDF3F8" stroke="#245E96" stroke-width="2.2"/>
<text x="720" y="95" font-size="44" font-weight="600" text-anchor="middle" fill="#1C3C5D">共同模型区</text>
<path d="M 460 113 L 980 113" stroke="#8194A4" stroke-width="1.6"/>
<text x="720" y="159" font-size="40" font-weight="400" text-anchor="middle" fill="#1C3C5D">工作流</text>
<text x="720" y="206" font-size="40" font-weight="400" text-anchor="middle" fill="#1C3C5D">设备能力与状态机</text>
<text x="720" y="253" font-size="40" font-weight="400" text-anchor="middle" fill="#1C3C5D">约束</text>
<path d="M 304 160 L 435 160" fill="none" stroke="#245E96" stroke-width="2.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#control)"/>
<rect x="435" y="404" width="570" height="86" rx="8" fill="#F4F6F7" stroke="#8194A4" stroke-width="2.2"/>
<text x="720" y="461" font-size="44" font-weight="600" text-anchor="middle" fill="#1C3C5D">仿真 Adapter</text>
<rect x="435" y="572" width="570" height="86" rx="8" fill="#F4F6F7" stroke="#8194A4" stroke-width="2.2"/>
<text x="720" y="629" font-size="44" font-weight="600" text-anchor="middle" fill="#1C3C5D">模拟设备 / 环境</text>
<path d="M 720 278 L 720 404" fill="none" stroke="#245E96" stroke-width="2.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#control)"/>
<text x="735" y="351" font-size="38" font-weight="400" text-anchor="start" fill="#1C3C5D">仿真执行</text>
<path d="M 720 490 L 720 572" fill="none" stroke="#245E96" stroke-width="2.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#control)"/>
<rect x="24" y="510" width="280" height="181" rx="8" fill="#EFF7F4" stroke="#187B66" stroke-width="2.2"/>
<text x="164" y="565" font-size="42" font-weight="600" text-anchor="middle" fill="#187B66">反馈与调整</text>
<text x="164" y="618" font-size="38" font-weight="400" text-anchor="middle" fill="#1C3C5D">状态、数据</text>
<text x="164" y="665" font-size="38" font-weight="400" text-anchor="middle" fill="#1C3C5D">约束结果</text>
<path d="M 435 617 L 304 617" fill="none" stroke="#187B66" stroke-width="2.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#feedback)"/>
<path d="M 164 510 L 164 217" fill="none" stroke="#187B66" stroke-width="2.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#feedback)"/>
