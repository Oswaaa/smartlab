<path d="M 1035 540 L 1070 540 L 1070 202 L 1197 202" fill="none" stroke="#187B66" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="13 9" marker-end="url(#feedback)"/>
<circle cx="1035" cy="540" r="4" fill="#187B66"/>
<text x="1090" y="291" font-size="38" font-weight="400" text-anchor="start" fill="#187B66">仿真评估</text>
<text x="1090" y="338" font-size="38" font-weight="400" text-anchor="start" fill="#187B66">上机依据</text>
<path d="M 1410 620 L 1447 620 L 1447 20 L 952 20 L 952 40" fill="none" stroke="#187B66" stroke-width="2.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#feedback)"/>
<text x="1192" y="58" font-size="38" font-weight="400" text-anchor="middle" fill="#187B66">实机反馈</text>
<text x="735" y="757" font-size="40" font-weight="600" text-anchor="middle" fill="#1C3C5D">仿真与实机共用上层模型与规则</text></svg>