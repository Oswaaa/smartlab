<text x="218" y="399" font-size="38" font-weight="400" text-anchor="middle" fill="#187B66">决策</text>
<path d="M 1005 618 L 1035 618 L 1035 230 L 1005 230" fill="none" stroke="#187B66" stroke-width="2.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#feedback)"/>
<polygon points="1265,85 1420,160 1265,235 1110,160" fill="#FCF5EB" stroke="#A85E18" stroke-width="2.4"/>
<text x="1265" y="149" font-size="38" font-weight="600" text-anchor="middle" fill="#A85E18">满足预设</text>
<text x="1265" y="195" font-size="38" font-weight="600" text-anchor="middle" fill="#A85E18">上机条件</text>
<path d="M 1005 160 L 1110 160" fill="none" stroke="#245E96" stroke-width="2.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#control)"/>
<path d="M 1265 235 L 1265 369" fill="none" stroke="#245E96" stroke-width="2.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#control)"/>
<text x="1300" y="307" font-size="38" font-weight="400" text-anchor="start" fill="#1C3C5D">满足</text>
<rect x="1120" y="369" width="290" height="86" rx="8" fill="#F4F6F7" stroke="#8194A4" stroke-width="2.2"/>
<text x="1265" y="426" font-size="41" font-weight="600" text-anchor="middle" fill="#1C3C5D">实机 Adapter</text>
<rect x="1120" y="572" width="290" height="86" rx="8" fill="#FFFFFF" stroke="#245E96" stroke-width="2.2"/>
<text x="1265" y="629" font-size="44" font-weight="600" text-anchor="middle" fill="#1C3C5D">物理设备</text>
