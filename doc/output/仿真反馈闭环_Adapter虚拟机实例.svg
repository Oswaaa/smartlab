<text x="290" y="480" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="25" font-weight="400" fill="#193B58">流程模型 / 设备控制请求</text>
<rect x="128" y="555" width="324" height="103" fill="#F3F7ED" stroke="#8295A4" stroke-width="1.8"/>
