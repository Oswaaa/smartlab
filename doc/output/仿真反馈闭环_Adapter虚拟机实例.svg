<svg xmlns="http://www.w3.org/2000/svg" width="2320" height="1320" viewBox="0 0 2320 1320"><title>仿真反馈闭环：Adapter 内的虚拟机实例</title><desc>大模型生成可选流程模型或直接提出设备请求，两种方式都经过设备模型与状态机。Adapter 在模拟开始时创建对应物理设备的虚拟机实例，本次模拟的所有指令都作用于该实例，更新其虚拟状态并返回设备状态和数据。反馈经过设备模型返回大模型，形成方案调整闭环。只有真机模式连接物理设备，模拟无问题后再经相同链路执行真机。</desc><rect x="0" y="0" width="2320" height="1320" fill="#FFF" stroke="none" stroke-width="0"/>
<rect x="100" y="310" width="380" height="390" fill="#F1F6FA" stroke="#8295A4" stroke-width="1.8"/>
<rect x="100" y="310" width="380" height="56" fill="#CCDEED" stroke="#8295A4" stroke-width="1.8"/>
