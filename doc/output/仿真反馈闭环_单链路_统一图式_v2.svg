<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#2d6fa5"/>
    </marker>
    <marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#168f86"/>
    </marker>
    <marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#c47b3b"/>
    </marker>
    <style>
      .outer { stroke:#8093a2; stroke-width:2; fill:#fff; }
      .header-blue { fill:#cbddec; stroke:#8093a2; stroke-width:2; }
      .header-green { fill:#dfeacf; stroke:#8093a2; stroke-width:2; }
      .header-yellow { fill:#f3e5b6; stroke:#8093a2; stroke-width:2; }
      .header-peach { fill:#f2d7c4; stroke:#8093a2; stroke-width:2; }
      .pale-blue { fill:#f1f6fb; stroke:#93a6b4; stroke-width:1.6; }
      .pale-green { fill:#f3f7ed; stroke:#93a6b4; stroke-width:1.6; }
      .pale-yellow { fill:#fffaf0; stroke:#93a6b4; stroke-width:1.6; }
      .pale-peach { fill:#fff8f3; stroke:#93a6b4; stroke-width:1.6; }
      .ink { fill:#1c405b; font-family:'Microsoft YaHei','微软雅黑',sans-serif; }
      .title { font-size:27px; font-weight:700; }
      .head { font-size:25px; font-weight:700; }
      .subhead { font-size:22px; font-weight:700; }
      .body { font-size:20px; }
      .small { font-size:17px; }
      .label { font-size:19px; font-weight:700; }
      .blueLine { stroke:#2d6fa5; stroke-width:3; fill:none; marker-end:url(#blueArrow); }
      .tealLine { stroke:#168f86; stroke-width:3; fill:none; marker-end:url(#tealArrow); }
      .orangeLine { stroke:#c47b3b; stroke-width:2.5; fill:none; stroke-dasharray:8 6; marker-end:url(#orangeArrow); }
      .guide { stroke:#a8b6c0; stroke-width:1.5; stroke-dasharray:5 5; fill:none; }
    </style>
  </defs>

  <!-- LLM -->
  <rect x="105" y="180" width="295" height="505" fill="#ffffff" stroke="#8093a2" stroke-width="2"/>
  <rect x="105" y="180" width="295" height="62" fill="#cbddec" stroke="#8093a2" stroke-width="2"/>
  <text x="130" y="221" class="ink head">大模型</text>
  <rect x="132" y="276" width="241" height="142" fill="#f1f6fb" stroke="#93a6b4" stroke-width="1.6"/>
  <text x="252" y="315" text-anchor="middle" class="ink subhead">决策与请求</text>
  <text x="252" y="355" text-anchor="middle" class="ink body">提出任务方案</text>
  <text x="252" y="389" text-anchor="middle" class="ink body">发出控制请求</text>
  <rect x="132" y="472" width="241" height="155" fill="#f3f7ed" stroke="#93a6b4" stroke-width="1.6"/>
  <text x="252" y="512" text-anchor="middle" class="ink subhead">反馈分析与调整</text>
  <text x="252" y="552" text-anchor="middle" class="ink body">分析模拟状态 / 数据</text>
  <text x="252" y="588" text-anchor="middle" class="ink body">调整方案后再次请求</text>

  <!-- Workflow -->
  <rect x="490" y="180" width="315" height="505" fill="#ffffff" stroke="#8093a2" stroke-width="2"/>
  <rect x="490" y="180" width="315" height="62" fill="#cbddec" stroke="#8093a2" stroke-width="2"/>
  <text x="515" y="221" class="ink head">工作流节点</text>
  <text x="779" y="218" text-anchor="end" class="ink small">按需参与</text>
  <rect x="520" y="276" width="255" height="142" fill="#f1f6fb" stroke="#93a6b4" stroke-width="1.6"/>
  <text x="647" y="317" text-anchor="middle" class="ink subhead">组织步骤与触发执行</text>
  <text x="647" y="357" text-anchor="middle" class="ink body">承接任务请求</text>
  <text x="647" y="391" text-anchor="middle" class="ink body">发出执行信号</text>
  <rect x="520" y="472" width="255" height="155" fill="#f3f7ed" stroke="#93a6b4" stroke-width="1.6"/>
  <text x="647" y="512" text-anchor="middle" class="ink subhead">反馈更新</text>
  <text x="647" y="552" text-anchor="middle" class="ink body">更新变量与节点状态</text>
  <text x="647" y="588" text-anchor="middle" class="ink body">判断完成条件</text>
  <path d="M760 588 L760 530" fill="none" stroke="#168f86" stroke-width="3" marker-end="url(#tealArrow)"/>

  <!-- Device model / FSM -->
  <rect x="895" y="180" width="350" height="505" fill="#ffffff" stroke="#8093a2" stroke-width="2"/>
  <rect x="895" y="180" width="350" height="62" fill="#dfeacf" stroke="#8093a2" stroke-width="2"/>
  <text x="920" y="221" class="ink head">设备模型 / 状态机</text>
  <rect x="925" y="276" width="290" height="142" fill="#f3f7ed" stroke="#93a6b4" stroke-width="1.6"/>
  <text x="1070" y="317" text-anchor="middle" class="ink subhead">请求处理与状态转移</text>
  <text x="1070" y="357" text-anchor="middle" class="ink body">检查能力与当前状态</text>
  <text x="1070" y="391" text-anchor="middle" class="ink body">生成标准控制指令</text>
  <rect x="925" y="472" width="290" height="155" fill="#f3f7ed" stroke="#93a6b4" stroke-width="1.6"/>
  <text x="1070" y="512" text-anchor="middle" class="ink subhead">状态与数据更新</text>
  <text x="1070" y="552" text-anchor="middle" class="ink body">接收事件 / 设备数据</text>
  <text x="1070" y="588" text-anchor="middle" class="ink body">更新状态与属性</text>
  <path d="M1200 588 L1200 530" fill="none" stroke="#168f86" stroke-width="3" marker-end="url(#tealArrow)"/>

  <!-- Adapter -->
  <rect x="1335" y="145" width="350" height="540" fill="#ffffff" stroke="#8093a2" stroke-width="2"/>
  <rect x="1335" y="145" width="350" height="62" fill="#f3e5b6" stroke="#8093a2" stroke-width="2"/>
  <text x="1360" y="186" class="ink head">Adapter</text>
  <text x="1658" y="184" text-anchor="end" class="ink small">统一接口</text>
  <rect x="1362" y="240" width="296" height="210" fill="#fffaf0" stroke="#93a6b4" stroke-width="1.6"/>
  <rect x="1362" y="240" width="296" height="46" fill="#f3e5b6" stroke="#8093a2" stroke-width="2"/>
  <text x="1510" y="271" text-anchor="middle" class="ink subhead">模拟执行</text>
  <text x="1510" y="326" text-anchor="middle" class="ink body">接收控制指令</text>
  <path d="M1510 344 L1510 372" fill="none" stroke="#2d6fa5" stroke-width="3" marker-end="url(#blueArrow)"/>
  <text x="1510" y="410" text-anchor="middle" class="ink body">生成模拟状态 / 数据</text>
  <rect x="1362" y="478" width="296" height="150" fill="#fff8f3" stroke="#93a6b4" stroke-width="1.6"/>
  <rect x="1362" y="478" width="296" height="46" fill="#f2d7c4" stroke="#8093a2" stroke-width="2"/>
  <text x="1510" y="509" text-anchor="middle" class="ink subhead">真机执行（次要分支）</text>
  <text x="1510" y="563" text-anchor="middle" class="ink body">指令映射 / 反馈转换</text>
  <text x="1510" y="600" text-anchor="middle" class="ink small">仅此分支连接物理设备</text>

  <!-- Physical hardware -->
  <rect x="1450" y="760" width="235" height="90" fill="#fff8f3" stroke="#93a6b4" stroke-width="1.6"/>
  <rect x="1450" y="760" width="235" height="42" fill="#f2d7c4" stroke="#8093a2" stroke-width="2"/>
  <text x="1568" y="789" text-anchor="middle" class="ink label">物理设备</text>
  <text x="1568" y="832" text-anchor="middle" class="ink small">执行操作 / 返回真实数据</text>
  <path d="M1510 628 L1510 758" fill="none" stroke="#2d6fa5" stroke-width="3" marker-end="url(#blueArrow)"/>
  <text x="1525" y="712" class="ink small">驱动指令</text>
  <path d="M1625 758 L1625 628" fill="none" stroke="#168f86" stroke-width="3" marker-end="url(#tealArrow)"/>
  <text x="1635" y="712" class="ink small">测量 / 状态</text>

  <!-- main control lane -->
  <path d="M400 330 L490 330" fill="none" stroke="#2d6fa5" stroke-width="3" marker-end="url(#blueArrow)"/>
  <polygon points="490,330 476,322 476,338" fill="#2d6fa5"/>
  <text x="445" y="310" text-anchor="middle" class="ink label">任务请求</text>
  <path d="M805 330 L895 330" fill="none" stroke="#2d6fa5" stroke-width="3" marker-end="url(#blueArrow)"/>
  <polygon points="895,330 881,322 881,338" fill="#2d6fa5"/>
  <text x="850" y="310" text-anchor="middle" class="ink label">执行信号</text>
  <path d="M1245 330 L1335 330" fill="none" stroke="#2d6fa5" stroke-width="3" marker-end="url(#blueArrow)"/>
  <polygon points="1335,330 1321,322 1321,338" fill="#2d6fa5"/>
  <text x="1290" y="310" text-anchor="middle" class="ink label">控制指令</text>

  <!-- main feedback lane -->
  <path d="M1335 560 L1245 560" fill="none" stroke="#168f86" stroke-width="3" marker-end="url(#tealArrow)"/>
  <polygon points="1245,560 1259,552 1259,568" fill="#168f86"/>
  <text x="1290" y="540" text-anchor="middle" class="ink label">设备状态 / 数据</text>
  <path d="M895 560 L805 560" fill="none" stroke="#168f86" stroke-width="3" marker-end="url(#tealArrow)"/>
  <polygon points="805,560 819,552 819,568" fill="#168f86"/>
  <text x="850" y="540" text-anchor="middle" class="ink label">执行状态 / 数据</text>
  <path d="M490 560 L400 560" fill="none" stroke="#168f86" stroke-width="3" marker-end="url(#tealArrow)"/>
  <polygon points="400,560 414,552 414,568" fill="#168f86"/>
  <text x="445" y="540" text-anchor="middle" class="ink label">模拟执行反馈</text>

  <!-- feedback analysis loop at LLM -->
  <path d="M132 548 L55 548 L55 335 L132 335" fill="none" stroke="#168f86" stroke-width="3" marker-end="url(#tealArrow)"/>
  <polygon points="132,335 118,327 118,343" fill="#168f86"/>
  <text x="58" y="710" class="ink small">调整后再次执行</text>

  <!-- explanatory notes -->
  <rect x="105" y="735" width="1215" height="120" fill="#ffffff" stroke="#8093a2" stroke-width="2"/>
  <text x="712" y="778" text-anchor="middle" class="ink body">模拟反馈按设备数据处理，沿原链路更新状态并返回大模型</text>
  <text x="712" y="820" text-anchor="middle" class="ink body">完成一轮模拟执行后，大模型可依据反馈调整方案并再次执行</text>

  <!-- small legend -->
  <path d="M105 900 L142 900" fill="none" stroke="#2d6fa5" stroke-width="3" marker-end="url(#blueArrow)"/>
  <text x="154" y="907" class="ink small">控制请求 / 指令</text>
  <path d="M340 900 L377 900" fill="none" stroke="#168f86" stroke-width="3" marker-end="url(#tealArrow)"/>
  <text x="389" y="907" class="ink small">状态 / 数据反馈</text>
</svg>
