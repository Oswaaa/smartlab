<path d="M1060,218 L1280,218 L1280,310" fill="none" stroke="#2869A1" stroke-width="3" stroke-linejoin="miter"/>
<polygon points="1280,310 1285.5,297 1274.5,297" fill="#2869A1"/>
<text x="1204" y="193" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="26" font-weight="400" fill="#2869A1">设备能力调用</text>
<path d="M1445,310 L1445,68 L1025,68 L1025,102" fill="none" stroke="#148779" stroke-width="3" stroke-linejoin="miter" stroke-dasharray="9 7"/>
