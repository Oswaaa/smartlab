<text x="2198" y="349" text-anchor="end" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="22" font-weight="400" fill="#193B58">同一控制与反馈接口</text>
<rect x="1780" y="401" width="405" height="177" fill="#FFF" stroke="#8295A4" stroke-width="1.8"/>
<rect x="1780" y="401" width="405" height="56" fill="#F3E4B3" stroke="#8295A4" stroke-width="1.8"/>
<text x="1802" y="439" text-anchor="start" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="32" font-weight="700" fill="#193B58">模拟模式</text>
<text x="1982" y="497" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="27" font-weight="400" fill="#193B58">依据指令进行模拟执行</text>
<text x="1982" y="551" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="26" font-weight="400" fill="#148779">返回模拟设备状态 / 数据</text>
<rect x="1780" y="664" width="405" height="138" fill="#FFF" stroke="#8295A4" stroke-width="1.8"/>
<rect x="1780" y="664" width="405" height="56" fill="#F1D5C1" stroke="#8295A4" stroke-width="1.8"/>
<text x="1802" y="702" text-anchor="start" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="32" font-weight="700" fill="#193B58">真机模式</text>
<text x="1982" y="762" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="26" font-weight="400" fill="#193B58">指令映射 / 真实反馈转换</text>
<text x="1982" y="626" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="25" font-weight="400" fill="#193B58">执行模式由上位机指定</text>
