<svg xmlns="http://www.w3.org/2000/svg" width="2320" height="1130" viewBox="0 0 2320 1130"><title>仿真反馈闭环：可选流程模型与设备直接控制</title><desc>大模型可以生成流程模型或直接控制设备，两种方式均经过设备模型与状态机，再调用同一个Adapter。模拟数据经模型更新返回大模型，形成方案调整闭环。真机模式独立连接物理设备，模拟无问题后再通过同一链路进行真机执行。</desc><rect x="0" y="0" width="2320" height="1130" fill="#FFF" stroke="none" stroke-width="0"/>
<rect x="100" y="310" width="380" height="390" fill="#F1F6FA" stroke="#8295A4" stroke-width="1.8"/>
<rect x="100" y="310" width="380" height="56" fill="#CCDEED" stroke="#8295A4" stroke-width="1.8"/>
<text x="122" y="348" text-anchor="start" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="32" font-weight="700" fill="#193B58">大模型</text>
<rect x="128" y="401" width="324" height="111" fill="#FFF" stroke="#8295A4" stroke-width="1.8"/>
<text x="290" y="441" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="29" font-weight="700" fill="#193B58">生成或调整实验方案</text>
<text x="290" y="480" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="25" font-weight="400" fill="#193B58">流程模型 / 设备控制请求</text>
<rect x="128" y="555" width="324" height="103" fill="#F3F7ED" stroke="#8295A4" stroke-width="1.8"/>
<text x="290" y="595" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="29" font-weight="700" fill="#193B58">分析模拟反馈</text>
<text x="290" y="634" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="25" font-weight="400" fill="#193B58">改进实验步骤与参数</text>
<rect x="670" y="102" width="390" height="174" fill="#F1F6FA" stroke="#8295A4" stroke-width="1.8"/>
<rect x="670" y="102" width="390" height="56" fill="#CCDEED" stroke="#8295A4" stroke-width="1.8"/>
<text x="692" y="140" text-anchor="start" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="32" font-weight="700" fill="#193B58">流程模型（可选）</text>
<text x="865" y="207" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="28" font-weight="400" fill="#193B58">组织步骤与数据依赖</text>
<text x="865" y="246" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="25" font-weight="400" fill="#193B58">执行模型并调用设备能力</text>
<rect x="1130" y="310" width="440" height="390" fill="#F3F7ED" stroke="#8295A4" stroke-width="1.8"/>
<rect x="1130" y="310" width="440" height="56" fill="#DFE9CE" stroke="#8295A4" stroke-width="1.8"/>
<text x="1152" y="348" text-anchor="start" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="32" font-weight="700" fill="#193B58">设备模型</text>
<text x="1350" y="410" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="31" font-weight="700" fill="#193B58">能力模型 + 状态机</text>
<rect x="1160" y="441" width="380" height="70" fill="#FFF" stroke="#8295A4" stroke-width="1.8"/>
<text x="1350" y="484" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="26" font-weight="400" fill="#193B58">请求检查 / 状态转移 / 发令</text>
<rect x="1160" y="548" width="380" height="104" fill="#FFF" stroke="#8295A4" stroke-width="1.8"/>
<text x="1350" y="590" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="26" font-weight="400" fill="#193B58">接收设备事件与测量数据</text>
<text x="1350" y="628" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="25" font-weight="400" fill="#193B58">更新状态、属性与执行结果</text>
<text x="1350" y="681" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="24" font-weight="700" fill="#193B58">设备请求均经过模型处理</text>
