<polygon points="452,606 465,611.5 465,600.5" fill="#148779"/>
<text x="758" y="777" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="29" font-weight="400" fill="#148779">模拟执行反馈</text>
<text x="770" y="829" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="25" font-weight="400" fill="#148779">状态、数据与约束结果</text>
