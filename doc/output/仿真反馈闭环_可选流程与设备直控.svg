<polygon points="128,456 115,450.5 115,461.5" fill="#148779"/>
<text x="58" y="731" text-anchor="start" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="25" font-weight="400" fill="#148779">调整后再次请求</text>
<rect x="1850" y="943" width="340" height="105" fill="#FFF7F0" stroke="#8295A4" stroke-width="1.8"/>
<rect x="1850" y="943" width="340" height="56" fill="#F1D5C1" stroke="#8295A4" stroke-width="1.8"/>
<text x="1872" y="981" text-anchor="start" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="32" font-weight="700" fill="#193B58">物理设备</text>
<text x="2020" y="1022" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="24" font-weight="400" fill="#193B58">执行操作并返回真实数据</text>
<path d="M1875,802 L1875,943" fill="none" stroke="#2869A1" stroke-width="3" stroke-linejoin="miter"/>
<polygon points="1875,943 1880.5,930 1869.5,930" fill="#2869A1"/>
<text x="1854" y="915" text-anchor="end" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="24" font-weight="400" fill="#2869A1">驱动指令</text>
<path d="M2135,943 L2135,802" fill="none" stroke="#148779" stroke-width="3" stroke-linejoin="miter"/>
<polygon points="2135,802 2129.5,815 2140.5,815" fill="#148779"/>
<text x="2152" y="915" text-anchor="start" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="24" font-weight="400" fill="#148779">测量 / 状态</text>
<text x="125" y="941" text-anchor="start" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="32" font-weight="700" fill="#148779">模拟执行 → 反馈分析 → 调整方案 → 再次执行</text>
<text x="125" y="998" text-anchor="start" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="27" font-weight="400" fill="#193B58">先在模拟中优化实验方案，确认无问题后，再经同一链路进行真机执行。</text>
<text x="125" y="1050" text-anchor="start" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="25" font-weight="400" fill="#193B58">模拟反馈与真实反馈采用相同的模型更新、执行推进和约束处理规则。</text></svg>