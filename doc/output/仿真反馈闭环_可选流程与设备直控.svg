<text x="1254" y="48" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="25" font-weight="400" fill="#148779">流程状态 / 数据反馈</text>
<path d="M1570,476 L1710,476" fill="none" stroke="#2869A1" stroke-width="3" stroke-linejoin="miter"/>
