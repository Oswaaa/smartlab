<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1120" viewBox="0 0 2000 1120" role="img"><title>资源层：设备对象模型的组成</title><desc>局部放大整体框架中的 R 模块：能力模型与状态机共同构成设备对象模型。</desc><defs><marker id="control" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#111111"/></marker><marker id="feedback" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#111111"/></marker><marker id="constraint" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#111111"/></marker><marker id="guide" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#686868"/></marker></defs><style>text{font-family:'Microsoft YaHei','微软雅黑',sans-serif}</style><rect width="2000" height="1120" fill="#FFFFFF"/><text x="1000" y="53" text-anchor="middle" fill="#111111" font-size="40" font-weight="600">资源层：设备对象模型的组成</text>
<g transform="translate(220 150) scale(2)">
<rect x="0" y="0" width="780" height="440" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
<rect x="0" y="0" width="780" height="50" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.6"/>
<text x="24" y="36" text-anchor="start" fill="#111111" font-size="31" font-weight="600">R  资源层</text>
<rect x="30" y="85" width="720" height="320" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.6"/>
<text x="390" y="128" text-anchor="middle" fill="#111111" font-size="30" font-weight="600">设备对象模型</text>
<rect x="60" y="163" width="300" height="204" rx="0" fill="#FFFFFF" stroke="#686868" stroke-width="1.3"/>
<text x="210" y="202" text-anchor="middle" fill="#111111" font-size="29" font-weight="600">能力模型</text>
<text x="210" y="252" text-anchor="middle" fill="#111111" font-size="24" font-weight="400">设备属性与可用能力</text>
<text x="210" y="292" text-anchor="middle" fill="#111111" font-size="24" font-weight="400">参数、接口与数据端口</text>
<text x="210" y="332" text-anchor="middle" fill="#111111" font-size="24" font-weight="400">内禀约束</text>
<rect x="420" y="163" width="300" height="204" rx="0" fill="#FFFFFF" stroke="#686868" stroke-width="1.3"/>
<text x="570" y="202" text-anchor="middle" fill="#111111" font-size="29" font-weight="600">状态机</text>
<text x="570" y="252" text-anchor="middle" fill="#111111" font-size="24" font-weight="400">控制请求与状态判断</text>
<text x="570" y="292" text-anchor="middle" fill="#111111" font-size="24" font-weight="400">状态转移与指令输出</text>
<text x="570" y="332" text-anchor="middle" fill="#111111" font-size="24" font-weight="400">事件、数据与状态更新</text>
<text x="390" y="282" text-anchor="middle" fill="#686868" font-size="36" font-weight="400">＋</text>
</g>
<text x="1000" y="1080" text-anchor="middle" fill="#111111" font-size="32" font-weight="600">能力模型定义“能做什么”，状态机描述“如何执行”。</text></svg>