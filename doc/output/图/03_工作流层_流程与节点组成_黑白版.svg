<rect x="30" y="163" width="720" height="255" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.6"/>
<text x="390" y="199" text-anchor="middle" fill="#111111" font-size="28" font-weight="600">工作流节点</text>
<rect x="54" y="218" width="329" height="74" rx="0" fill="#FFFFFF" stroke="#686868" stroke-width="1.2"/>
