<rect x="407" y="218" width="319" height="74" rx="0" fill="#FFFFFF" stroke="#686868" stroke-width="1.2"/>
<text x="566.5" y="248" text-anchor="middle" fill="#111111" font-size="25" font-weight="600">节点生命周期</text>
