<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>节点与连线样式方案</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #fff;
      --border: #e2e8f0;
      --heading: #0f172a;
      --body: #334155;
      --muted: #64748b;
      --primary: #2563eb;
      --exec0: #93c5fd;
      --data0: #c4b5fd;
      --exec1: #60a5fa;
      --data1: #a78bfa;
      --exec2: #3b82f6;
      --data2: #8b5cf6;
      --exec-hot: #2563eb;
      --data-hot: #6d28d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--body);
      background: var(--bg);
      font: 13px/1.55 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 8;
      padding: 16px 24px 14px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    header h1 { margin: 0 0 4px; color: var(--heading); font-size: 18px; font-weight: 700; }
    header p { margin: 0; max-width: 960px; color: var(--muted); }
    header strong { color: var(--primary); }
    .page { padding: 20px 24px 56px; }
    h2.section {
      margin: 8px 0 12px;
      color: var(--heading);
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .grid.wide { grid-template-columns: repeat(auto-fit, minmax(640px, 1fr)); }
    .option {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    .option.current { border-color: #cbd5e1; }
    .option.pick { border-color: #93c5fd; box-shadow: 0 0 0 3px #dbeafe; }
    .meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .meta h3 { margin: 0 0 4px; color: var(--heading); font-size: 14px; font-weight: 700; }
    .meta p { margin: 0; color: var(--muted); font-size: 12px; }
    .tag {
      flex: none;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eff6ff;
      color: var(--primary);
      font-size: 11px;
      font-weight: 600;
    }
    .tag.warn { background: #fff7ed; color: #c2410c; }
    .stage {
      position: relative;
      min-height: 168px;
      padding: 28px 24px 32px;
      background:
        radial-gradient(circle, #dbe3ec 1px, transparent 1.2px) 0 0 / 20px 20px,
        #f8fafc;
    }
    .stage.nodes { min-height: 168px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    .swatches { display: flex; gap: 8px; margin-top: 8px; }
    .swatch {
      width: 22px;
      height: 10px;
      border-radius: 99px;
    }
    .wires {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .node {
      position: relative;
      width: 220px;
      min-height: 108px;
      display: flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .06);
      flex: none;
    }
    .node.selected { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,.16); }
    .iface, .port {
      position: absolute;
      z-index: 3;
      width: 10px;
      height: 10px;
      border: 2px solid #fff;
    }
    .iface { border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .port { border-radius: 2px; background: #6d28d9; box-shadow: 0 0 0 1px #6d28d9; }
    .legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
    }
    .legend i {
      display: inline-block;
      width: 22px;
      height: 0;
      margin-right: 6px;
      border-top: 2px solid currentColor;
      vertical-align: middle;
    }
    .legend .data i { border-top-style: dashed; }
    .choice-bar {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      font-size: 13px;
    }
    .choice-bar b { color: var(--heading); }

    /* current */
    .skin-current { padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1; }
    .skin-current .bar { position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 2px 2px 0; }
    .skin-current .top { display: flex; align-items: center; gap: 6px; }
    .skin-current .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .skin-current .kind { color: var(--muted); font-size: 11px; }
    .skin-current .name { color: var(--heading); font-size: 12px; font-weight: 600; }
    .skin-current .op { margin-top: 6px; color: var(--heading); font-size: 13px; font-weight: 700; }
    .skin-current .params { color: var(--muted); font-size: 11px; }

    /* A pill + name title */
    .skin-a { padding: 10px 12px 10px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1; gap: 6px; }
    .skin-a .bar { position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 2px 2px 0; }
    .skin-a .pill {
      align-self: flex-start;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
    }
    .skin-a .name { color: var(--heading); font-size: 13px; font-weight: 700; line-height: 1.2; }
    .skin-a .op { color: var(--body); font-size: 12px; font-weight: 600; }
    .skin-a .params { color: var(--muted); font-size: 11px; }

    /* B top color strip */
    .skin-b { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .skin-b .head {
      padding: 8px 12px 7px;
      border-bottom: 1px solid var(--border);
      border-top: 3px solid var(--tone);
    }
    .skin-b .kind { color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .04em; }
    .skin-b .name { color: var(--heading); font-size: 13px; font-weight: 700; }
    .skin-b .body { padding: 8px 12px 10px; }
    .skin-b .op { color: var(--heading); font-size: 12px; font-weight: 650; }
    .skin-b .params { color: var(--muted); font-size: 11px; }

    /* C icon rail */
    .skin-c { display: flex; min-width: 0; flex: 1; }
    .skin-c .rail {
      width: 36px;
      flex: none;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px 0 0 6px;
    }
    .skin-c .copy { min-width: 0; padding: 10px 12px; display: flex; flex-direction: column; justify-content: center; }
    .skin-c .kind { color: var(--muted); font-size: 10px; font-weight: 600; }
    .skin-c .name { color: var(--heading); font-size: 13px; font-weight: 700; }
    .skin-c .op { margin-top: 4px; color: var(--body); font-size: 12px; font-weight: 600; }
    .skin-c .params { color: var(--muted); font-size: 11px; }

    /* D compact two-line */
    .skin-d { padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1; gap: 6px; }
    .skin-d .bar { position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 2px 2px 0; }
    .skin-d .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .skin-d .pill {
      flex: none;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }
    .skin-d .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--heading); font-size: 13px; font-weight: 700; }
    .skin-d .sub { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .tone-device { --tone: #2563eb; --tone-soft: #eff6ff; --tone-text: #1d4ed8; }
    .tone-start { --tone: #16a34a; --tone-soft: #f0fdf4; --tone-text: #15803d; }
    .tone-branch { --tone: #d97706; --tone-soft: #fffbeb; --tone-text: #b45309; }
    .tone-end { --tone: #64748b; --tone-soft: #f8fafc; --tone-text: #475569; }
    .fill-tone { background: var(--tone); }
    .soft-tone { background: var(--tone-soft); color: var(--tone-text); }
  </style>
</head>
<body>
  <header>
    <h1>节点卡片与连线颜色</h1>
    <p>连线和节点可分开选。除加深档外新增两版对照：<strong>双色降饱和</strong>（保留蓝/紫分类、整体压灰）和<strong>克制灰</strong>（默认中性灰，蓝/紫只给悬停与运行态，Dify / AntD 的做法）。节点方案都保留：左控制口、上下数据口、开始/设备/分支/结束的类型色。</p>
  </header>

  <main class="page">
    <h2 class="section">1. 连线颜色</h2>
    <div class="grid" id="color-grid"></div>

    <h2 class="section">2. 节点卡片</h2>
    <div class="grid wide" id="node-grid"></div>
  </main>

  <div class="choice-bar">
    <span>当前选择：颜色 <b id="color-choice">未选</b> · 节点 <b id="node-choice">未选</b></span>
    <span>点卡片选中，然后回复例如「颜色一档 + 节点 A」</span>
  </div>

  <script>
    const colors = [
      {
        id: "current",
        tag: "当前",
        warn: true,
        title: "现状",
        desc: "执行流 #93c5fd，数据流 #c4b5fd。浅，叠在网格上不够清楚。",
        exec: "#93c5fd",
        data: "#c4b5fd",
      },
      {
        id: "one",
        tag: "一档",
        title: "加深一档",
        desc: "执行流 #60a5fa，数据流 #a78bfa。仍比悬停色浅，默认能看清。",
        exec: "#60a5fa",
        data: "#a78bfa",
      },
      {
        id: "two",
        tag: "两档",
        title: "再深一点",
        desc: "执行流 #3b82f6，数据流 #8b5cf6。更接近品牌色，默认就已经比较实。",
        exec: "#3b82f6",
        data: "#8b5cf6",
      },
      {
        id: "muted",
        tag: "降饱和",
        title: "双色降饱和",
        desc: "保留蓝/紫分类，换成灰调 #6b8cae / #8b7fa8。类别区分还在，但不刺眼。",
        exec: "#6b8cae",
        data: "#8b7fa8",
      },
      {
        id: "restrained",
        tag: "大厂风",
        title: "克制灰 + 状态色",
        desc: "Dify / AntD 做法：默认连线中性灰 #94a3b8，靠实线/虚线分流派；蓝 #2563eb、紫 #6d28d9 只在悬停、选中、运行态出现。",
        exec: "#94a3b8",
        data: "#94a3b8",
      },
    ]

    const samples = [
      { cls: "tone-start", kind: "开始节点", name: "start1", op: "启动流程执行", glyph: "▶" },
      { cls: "tone-device", kind: "设备能力", name: "device1", op: "加热", params: "目标温度、加热时间", glyph: "▣", ports: true, selected: true },
      { cls: "tone-branch", kind: "分支节点", name: "branch1", op: "按控制接口判断下游路径", glyph: "◇" },
      { cls: "tone-end", kind: "结束节点", name: "end1", op: "结束流程执行", glyph: "■" },
    ]

    const nodeOptions = [
      { id: "current", tag: "当前", warn: true, title: "现状", desc: "左边条 + 圆点类型 + 名称同一行，操作名再下一行。信息挤，类型不够醒目。" },
      { id: "a", tag: "A", title: "方案 A · 类型胶囊，名称当标题", desc: "类型做成彩色胶囊，节点名作为主标题，操作和参数降为说明。结构最清晰，改动也小。" },
      { id: "b", tag: "B", title: "方案 B · 顶部色条 + 标题区", desc: "去掉左边条，改成顶边色条。类型和名称在浅分隔的标题区，操作放在下方。" },
      { id: "c", tag: "C", title: "方案 C · 左侧色块图标", desc: "左侧 36px 色块放类型符号，右边排名称和操作。更像节点积木，占宽稍多。" },
      { id: "d", tag: "D", title: "方案 D · 紧凑两行", desc: "一行：类型胶囊 + 名称。二行：操作 · 参数。卡片更干净，长表达式会被收成一行。" },
    ]

    const skins = {
      current: s => `
        <div class="skin-current">
          <span class="bar fill-tone"></span>
          <div class="top"><span class="dot fill-tone"></span><span class="kind">${s.kind}</span><strong class="name">${s.name}</strong></div>
          <div class="op">${s.op}</div>
          ${s.params ? `<div class="params">${s.params}</div>` : ""}
        </div>`,
      a: s => `
        <div class="skin-a">
          <span class="bar fill-tone"></span>
          <span class="pill soft-tone">${s.kind}</span>
          <div class="name">${s.name}</div>
          <div class="op">${s.op}</div>
          ${s.params ? `<div class="params">${s.params}</div>` : ""}
        </div>`,
      b: s => `
        <div class="skin-b">
          <div class="head" style="background:var(--tone-soft)">
            <div class="kind">${s.kind}</div>
            <div class="name">${s.name}</div>
          </div>
          <div class="body">
            <div class="op">${s.op}</div>
            ${s.params ? `<div class="params">${s.params}</div>` : ""}
          </div>
        </div>`,
      c: s => `
        <div class="skin-c">
          <div class="rail fill-tone">${s.glyph}</div>
          <div class="copy">
            <div class="kind">${s.kind}</div>
            <div class="name">${s.name}</div>
            <div class="op">${s.op}</div>
            ${s.params ? `<div class="params">${s.params}</div>` : ""}
          </div>
        </div>`,
      d: s => `
        <div class="skin-d">
          <span class="bar fill-tone"></span>
          <div class="row"><span class="pill soft-tone">${s.kind.replace("节点","").replace("能力","")}</span><span class="name">${s.name}</span></div>
          <div class="sub">${s.params ? `${s.op} · ${s.params}` : s.op}</div>
        </div>`,
    }

    const colorGrid = document.getElementById("color-grid")
    const nodeGrid = document.getElementById("node-grid")

    colors.forEach(item => colorGrid.appendChild(colorCard(item)))
    nodeOptions.forEach(item => nodeGrid.appendChild(nodeCard(item)))

    function colorCard(item) {
      const el = document.createElement("article")
      el.className = "option" + (item.warn ? " current" : "")
      el.dataset.group = "color"
      el.dataset.id = item.id
      el.innerHTML = `
        <div class="meta">
          <div>
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
            <div class="swatches">
              <span class="swatch" style="background:${item.exec}"></span>
              <span class="swatch" style="background:${item.data}"></span>
              <span class="swatch" style="background:#2563eb"></span>
              <span class="swatch" style="background:#6d28d9"></span>
            </div>
            <div class="legend">
              <span style="color:${item.exec}"><i></i>执行流</span>
              <span class="data" style="color:${item.data}"><i></i>数据流</span>
              <span style="color:#2563eb"><i></i>悬停</span>
            </div>
          </div>
          <span class="tag${item.warn ? " warn" : ""}">${item.tag}</span>
        </div>
        <div class="stage" style="height:148px">
          <svg class="wires" viewBox="0 0 360 148">
            <path d="M 118 58 H 198" fill="none" stroke="${item.exec}" stroke-width="1.8" />
            <path d="M 78 104 V 124 H 238 V 24" fill="none" stroke="${item.data}" stroke-width="1.8" stroke-dasharray="6 5" />
          </svg>
        </div>
      `
      const stage = el.querySelector(".stage")
      stage.appendChild(miniNode(28, 28, "设备能力", "device1"))
      stage.appendChild(miniNode(198, 28, "分支节点", "branch1", true))
      el.addEventListener("click", () => pick("color", item.id, item.tag))
      return el
    }

    function miniNode(left, top, kind, name, branch) {
      const node = document.createElement("div")
      node.className = "node"
      node.style.cssText = `position:absolute;left:${left}px;top:${top}px;width:120px;min-height:76px`
      node.innerHTML = `<div class="skin-current"><span class="bar fill-tone"></span><div class="top"><span class="dot fill-tone"></span><span class="kind">${kind}</span></div><div class="name">${name}</div></div>`
      node.classList.add(branch ? "tone-branch" : "tone-device")
      addPorts(node, { iface: true, ports: true, compact: true })
      return node
    }

    function nodeCard(item) {
      const el = document.createElement("article")
      el.className = "option" + (item.warn ? " current" : "")
      el.dataset.group = "node"
      el.dataset.id = item.id
      el.innerHTML = `
        <div class="meta">
          <div>
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
          </div>
          <span class="tag${item.warn ? " warn" : ""}">${item.tag}</span>
        </div>
        <div class="stage nodes"></div>
      `
      const stage = el.querySelector(".stage")
      samples.forEach(sample => stage.appendChild(renderNode(item.id, sample)))
      el.addEventListener("click", () => pick("node", item.id, item.tag))
      return el
    }

    function renderNode(skin, sample) {
      const node = document.createElement("div")
      node.className = `node ${sample.cls}${sample.selected ? " selected" : ""}`
      node.innerHTML = skins[skin](sample)
      addPorts(node, { iface: true, ports: sample.ports, extraOut: sample.cls === "tone-branch" })
      return node
    }

    function addPorts(node, { iface, ports, extraOut, compact }) {
      const top = compact ? "33px" : "49px"
      if (iface) {
        add(node, "iface", { left: "-5px", top })
        add(node, "iface", { right: "-5px", top })
      }
      if (extraOut) add(node, "iface", { right: "-5px", top: "72px" })
      if (ports) {
        add(node, "port", { left: compact ? "28px" : "68px", bottom: "-5px" })
        add(node, "port", { left: compact ? "72px" : "142px", bottom: "-5px" })
      }
    }

    function add(node, cls, style) {
      const el = document.createElement("span")
      el.className = cls
      Object.assign(el.style, style)
      node.appendChild(el)
    }

    const selected = { color: "", node: "" }
    function pick(group, id, label) {
      document.querySelectorAll(`.option[data-group="${group}"]`).forEach(item => item.classList.remove("pick"))
      document.querySelector(`.option[data-group="${group}"][data-id="${id}"]`).classList.add("pick")
      selected[group] = label
      document.getElementById("color-choice").textContent = selected.color || "未选"
      document.getElementById("node-choice").textContent = selected.node || "未选"
    }
  </script>
</body>
</html>
