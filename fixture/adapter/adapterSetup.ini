; Fixture: 模拟温度传感器 Adapter 注册配置
; 本文件会通过 MQTT 发送给 SmartLab 后端进行注册

[adapter]
specVersion = smartlab.adapter.config.v1
adapterName = FixtureTempAdapter
adapterDescription = 测试用温度传感器Adapter，模拟28-38度温度数据
rawConfigFormat = INI

[deviceTemplates.TempSensorTemplate]
categoryName = TempSensor
categoryDescription = 模拟温度传感器
description = 提供温度遥测与加热控制能力的模拟设备模板

[deviceTemplates.TempSensorTemplate.attributes]
temperature = [DOUBLE][当前温度，单位：摄氏度]

[deviceTemplates.TempSensorTemplate.commands.heat]
description = 加热到目标温度并保持

[deviceTemplates.TempSensorTemplate.commands.heat.parameters]
targetTemperature = [DOUBLE][目标温度][internal=false]
holdDurationSec = [INTEGER][温度保持时长，秒][internal=false]
index = [INTEGER][设备点编号][internal=true][sourceField=index]

[deviceTemplates.TempSensorTemplate.commands.cool]
description = 启动散热降温

[deviceTemplates.TempSensorTemplate.commands.cool.parameters]
durationSec = [INTEGER][散热时长，秒][internal=false]
index = [INTEGER][设备点编号][internal=true][sourceField=index]

[deviceTemplates.TempSensorTemplate.events.cmdEvents]
COMMAND_RECEIVED = 指令已接收
COMMAND_RUNNING = 指令执行中
COMMAND_COMPLETED = 指令执行完成
COMMAND_FAILED = 指令执行失败

[deviceTemplates.TempSensorTemplate.events.opEvents]
HEATING_STARTED = 加热已启动
TARGET_TEMPERATURE_REACHED = 已达目标温度
COOLING_STARTED = 散热已启动
TEMPERATURE_NORMAL = 温度恢复正常

[devicePoints.Sensor1]
templateName = TempSensorTemplate
description = 1号模拟温度传感器
index = 1

[devicePoints.Sensor1.attributeMapping]
temperature = temp_value
