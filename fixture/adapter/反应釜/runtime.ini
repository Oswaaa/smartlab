[smartlab]
broker = 127.0.0.1
port = 1883
username = adapter
password = 123456
clientId = adapterv2_client
keepAliveSec = 30
qos = 1

[runtime]
heartbeatIntervalSec = 10

[logging]
level = INFO

[reactor]
host = 127.0.0.1
port = 9997
pollIntervalSec = 1.0

[simulation]
; 每次发送打包的点数（默认 5，可调至 10~100）
batchSize = 20
; 发送周期（秒，默认 1.0，推荐 0.2~1.0）
intervalSec = 0.5
; 每个数据点对应的虚拟推演步长（毫秒，默认 1000ms=1秒；长周期实验可放大为 5000 或 30000 降低高频数据量）
simStepMs = 1000
