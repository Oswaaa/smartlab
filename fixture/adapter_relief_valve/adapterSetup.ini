; SmartLab Adapter INI 配置规范 - 智能泄压阀适配器
; 本文件通过 MQTT 发送给 SmartLab 后端完成物模型契约、属性、指令与设备点注册。
; 属性/参数值格式：[数据类型][描述][可选修饰符]...
; 支持数据类型：DOUBLE、INTEGER、BOOLEAN、STRING。

[adapter]
specVersion = smartlab.adapter.config.v1
adapterName = FixtureReliefValveAdapter
adapterDescription = 模拟智能泄压阀Adapter，支持管道压力监测(MPa)、动态开度上报、泄压与调压控制
rawConfigFormat = INI


; ============================================================
; deviceTemplates[]
; ============================================================

[deviceTemplates.ReliefValveTemplate]
categoryName = ReliefValve
categoryDescription = 智能安全泄压阀设备类别
description = 提供管道压力遥测(MPa)、阀门开度监测、泄压控制与调压保压能力的设备模板


; ============================================================
; deviceTemplates[].attributes[]
; ============================================================

[deviceTemplates.ReliefValveTemplate.attributes]
pressure = [DOUBLE][当前管道压力，单位：MPa]
valveOpening = [DOUBLE][阀门当前开度百分比，单位：%]


; ============================================================
; deviceTemplates[].commands[]
; ============================================================

[deviceTemplates.ReliefValveTemplate.commands.releasePressure]
description = 控制泄压阀开启并泄压到目标压力

[deviceTemplates.ReliefValveTemplate.commands.releasePressure.parameters]
targetPressure = [DOUBLE][目标压力，单位：MPa][internal=false]
releaseDurationSec = [INTEGER][泄压持续时间，秒][internal=false]
index = [INTEGER][设备点内部编号][internal=true][sourceField=index]


[deviceTemplates.ReliefValveTemplate.commands.adjustPressure]
description = 调节管道压力至设定目标值

[deviceTemplates.ReliefValveTemplate.commands.adjustPressure.parameters]
targetPressure = [DOUBLE][目标压力，单位：MPa][internal=false]
durationSec = [INTEGER][调节持续时间，秒][internal=false]
index = [INTEGER][设备点内部编号][internal=true][sourceField=index]


[deviceTemplates.ReliefValveTemplate.commands.emergencyVent]
description = 紧急全开快速泄压排气

[deviceTemplates.ReliefValveTemplate.commands.emergencyVent.parameters]
durationSec = [INTEGER][排气持续时间，秒][internal=false]
index = [INTEGER][设备点内部编号][internal=true][sourceField=index]


; ============================================================
; deviceTemplates[].events.cmdEvents[]
; 指令生命周期事件
; ============================================================

[deviceTemplates.ReliefValveTemplate.events.cmdEvents]
COMMAND_RECEIVED = 指令已接收
COMMAND_RUNNING = 指令执行中
COMMAND_COMPLETED = 指令执行完成
COMMAND_FAILED = 指令执行失败
COMMAND_TIMEOUT = 指令执行超时
COMMAND_CANCELLED = 指令已取消


; ============================================================
; deviceTemplates[].events.opEvents[]
; 运行/物理状态机事件
; ============================================================

[deviceTemplates.ReliefValveTemplate.events.opEvents]
RELIEF_STARTED = 开始泄压
TARGET_PRESSURE_REACHED = 达到目标压力
PRESSURE_ADJUSTED = 压力调节完成
PRESSURE_NORMAL = 压力正常
OVERPRESSURE_ALARM = 管道超压报警
EMERGENCY_VENT_TRIGGERED = 紧急排气触发


; ============================================================
; devicePoints[]
; ============================================================

[devicePoints.Valve1]
templateName = ReliefValveTemplate
description = 1号智能泄压阀
index = 1

[devicePoints.Valve1.attributeMapping]
pressure = pressure
valveOpening = valveOpening
